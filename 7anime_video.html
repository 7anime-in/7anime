<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>7anime - JSON & Bot Connection Checker</title>
    <!-- Plyr CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/plyr@3.7.8/dist/plyr.css" />
    <style>
        body {
            background-color: #0f1015;
            color: #fff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        h1 {
            color: #ffcc00;
            font-size: 22px;
            margin-bottom: 5px;
        }
        #status-box {
            font-size: 14px;
            color: #00ffcc;
            margin-bottom: 15px;
            background: #1a1c23;
            padding: 8px 12px;
            border-radius: 5px;
            border-left: 4px solid #00ffcc;
        }
        .player-wrapper {
            margin-bottom: 20px;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .episodes-section {
            background: #1a1c23;
            padding: 15px;
            border-radius: 8px;
        }
        .episodes-section h3 {
            margin-top: 0;
            font-size: 18px;
            color: #ddd;
        }
        .episodes-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(65px, 1fr));
            gap: 10px;
            margin-top: 10px;
            max-height: 220px;
            overflow-y: auto;
        }
        .ep-btn {
            background: #2a2d3d;
            border: none;
            color: #fff;
            padding: 10px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }
        .ep-btn:hover, .ep-btn.active {
            background: #ffcc00;
            color: #000;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 id="anime-title">Loading Anime Data...</h1>
        <div id="status-box">⏳ Checking sitevideo_data.json and Bot connection...</div>
        
        <div class="player-wrapper">
            <video id="player" playsinline controls>
                <source src="" type="video/mp4" />
            </video>
        </div>

        <div class="episodes-section">
            <h3>Season 1 Episodes</h3>
            <div class="episodes-grid" id="episodes-container"></div>
        </div>
    </div>

    <!-- Plyr JS -->
    <script src="https://cdn.jsdelivr.net/npm/plyr@3.7.8/dist/plyr.js"></script>
    <script>
        const player = new Plyr('#player');
        const episodesContainer = document.getElementById('episodes-container');
        const animeTitle = document.getElementById('anime-title');
        const statusBox = document.getElementById('status-box');

        // 🔍 sitevideo_data.json ko dynamically fetch karna
        async function loadAnimeData() {
            try {
                statusBox.innerText = "⏳ Fetching sitevideo_data.json from repository...";
                console.log("Fetching sitevideo_data.json...");

                const response = await fetch('sitevideo_data.json');
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const siteData = await response.json();
                console.log("✅ sitevideo_data.json loaded successfully:", siteData);
                statusBox.innerText = "✅ sitevideo_data.json loaded successfully! Initializing episodes...";

                // Ranma 1/2 data check karna
                if (!siteData.ranma1_2) {
                    throw new Error("ranma1_2 key not found in JSON data!");
                }

                const anime = siteData.ranma1_2;
                animeTitle.innerText = anime.title + " - Player";
                const season1Episodes = anime.seasons["1"];

                episodesContainer.innerHTML = "";

                season1Episodes.forEach((epData, index) => {
                    const btn = document.createElement('button');
                    btn.className = 'ep-btn';
                    btn.innerText = `Ep ${epData.ep}`;
                    btn.onclick = () => {
                        document.querySelectorAll('.ep-btn').forEach(b => b.classList.remove('active'));
                        btn.classList.add('active');
                        
                        console.log(`▶️ Playing Episode ${epData.ep} via URL: ${epData.stream_url}`);
                        statusBox.innerText = `🔗 Connecting to Bot Backend for Episode ${epData.ep}...`;

                        player.source = {
                            type: 'video',
                            sources: [
                                {
                                    src: epData.stream_url,
                                    type: 'video/mp4',
                                },
                            ],
                        };
                        player.play().then(() => {
                            statusBox.innerText = `🚀 Playing Episode ${epData.ep} successfully from Bot!`;
                        }).catch(err => {
                            console.error("Playback error:", err);
                            statusBox.innerText = `⚠️ Playback error on Episode ${epData.ep}. Check console.`;
                        });
                    };
                    episodesContainer.appendChild(btn);

                    // Pehla episode automatically load karne ke liye
                    if (index === 0) {
                        btn.click();
                    }
                });

            } catch (error) {
                console.error("❌ Error loading JSON or connecting:", error);
                statusBox.style.borderLeftColor = "#ff4d4d";
                statusBox.style.color = "#ff4d4d";
                statusBox.innerText = `❌ Failed: ${error.message}. Make sure sitevideo_data.json is in the same folder!`;
            }
        }

        // Run the checker function
        loadAnimeData();
    </script>
</body>
</html>
