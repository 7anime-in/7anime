<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>7anime - Testing Player</title>
    <!-- Plyr CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/plyr@3.7.8/dist/plyr.css" />
    <style>
        body {
            background-color: #0f1015;
            color: #fff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        h1 {
            color: #ffcc00;
            font-size: 22px;
            margin-bottom: 15px;
        }
        .player-wrapper {
            margin-bottom: 20px;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
        }
        .episodes-section {
            background: #1a1c23;
            padding: 15px;
            border-radius: 8px;
        }
        .episodes-section h3 {
            margin-top: 0;
            font-size: 18px;
            color: #ddd;
        }
        .episodes-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(65px, 1fr));
            gap: 10px;
            margin-top: 10px;
            max-height: 220px;
            overflow-y: auto;
        }
        .ep-btn {
            background: #2a2d3d;
            border: none;
            color: #fff;
            padding: 10px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }
        .ep-btn:hover, .ep-btn.active {
            background: #ffcc00;
            color: #000;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 id="anime-title">Ranma ½ - Testing Player</h1>
        
        <div class="player-wrapper">
            <video id="player" playsinline controls>
                <source src="" type="video/mp4" />
            </video>
        </div>

        <div class="episodes-section">
            <h3>Season 1 Episodes</h3>
            <div class="episodes-grid" id="episodes-container"></div>
        </div>
    </div>

    <!-- Plyr JS -->
    <script src="https://cdn.jsdelivr.net/npm/plyr@3.7.8/dist/plyr.js"></script>
    <script>
        // Tera sitevideo_data.json ka exact data structure
        const siteData = {
          "ranma1_2": {
            "title": "Ranma ½",
            "seasons": {
              "1": [
                { "ep": 1, "stream_url": "https://7anime-bot2-streamer.onrender.com/stream/ranma1_2_7anime/4.mp4" },
                { "ep": 2, "stream_url": "https://7anime-bot2-streamer.onrender.com/stream/ranma1_2_7anime/15.mp4" },
                { "ep": 3, "stream_url": "https://7anime-bot2-streamer.onrender.com/stream/ranma1_2_7anime/5.mp4" },
                { "ep": 4, "stream_url": "https://7anime-bot2-streamer.onrender.com/stream/ranma1_2_7anime/6.mp4" },
                { "ep": 5, "stream_url": "https://7anime-bot2-streamer.onrender.com/stream/ranma1_2_7anime/7.mp4" },
                { "ep": 6, "stream_url": "https://7anime-bot2-streamer.onrender.com/stream/ranma1_2_7anime/8.mp4" },
                { "ep": 7, "stream_url": "https://7anime-bot2-streamer.onrender.com/stream/ranma1_2_7anime/9.mp4" },
                { "ep": 8, "stream_url": "https://7anime-bot2-streamer.onrender.com/stream/ranma1_2_7anime/10.mp4" },
                { "ep": 9, "stream_url": "https://7anime-bot2-streamer.onrender.com/stream/ranma1_2_7anime/11.mp4" },
                { "ep": 10, "stream_url": "https://7anime-bot2-streamer.onrender.com/stream/ranma1_2_7anime/12.mp4" },
                { "ep": 11, "stream_url": "https://7anime-bot2-streamer.onrender.com/stream/ranma1_2_7anime/13.mp4" },
                { "ep": 12, "stream_url": "https://7anime-bot2-streamer.onrender.com/stream/ranma1_2_7anime/14.mp4" }
              ]
            }
          }
        };

        const player = new Plyr('#player');
        const episodesContainer = document.getElementById('episodes-container');
        const animeTitle = document.getElementById('anime-title');

        const anime = siteData.ranma1_2;
        animeTitle.innerText = anime.title + " - Testing Player";
        const season1Episodes = anime.seasons["1"];

        season1Episodes.forEach((epData, index) => {
            const btn = document.createElement('button');
            btn.className = 'ep-btn';
            btn.innerText = `Ep ${epData.ep}`;
            btn.onclick = () => {
                document.querySelectorAll('.ep-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                
                player.source = {
                    type: 'video',
                    sources: [
                        {
                            src: epData.stream_url,
                            type: 'video/mp4',
                        },
                    ],
                };
                player.play();
            };
            episodesContainer.appendChild(btn);

            // Pehla episode default load kar dega
            if (index === 0) {
                btn.click();
            }
        });
    </script>
</body>
</html>
