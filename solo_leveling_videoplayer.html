<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solo Leveling Hindi Official Audio - 7ANIME</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .spinner {
            width: 45px;
            height: 45px;
            border: 4px solid rgba(255, 85, 0, 0.2);
            border-top: 4px solid #ff5500;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .sidebar {
            position: fixed; top: 0; left: -280px; width: 280px; height: 100%;
            background-color: #151522; z-index: 100; transition: left 0.3s ease;
            box-shadow: 5px 0 15px rgba(0,0,0,0.5); border-right: 1px solid #2d2d3d;
        }
        .sidebar.active { left: 0; }
        .sidebar-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7); z-index: 99; display: none;
        }
        .sidebar-overlay.active { display: block; }
    </style>
</head>
<body class="bg-[#0b0c10] text-white font-sans antialiased">

    <!-- Header / Navbar -->
    <header class="main-header flex items-center justify-between px-4 py-3 bg-[#151522] border-b border-gray-800 relative z-50">
        <div class="flex items-center space-x-3">
            <button class="text-white text-lg focus:outline-none cursor-pointer" id="menuBtn" onclick="toggleSidebar()">
                <i class="fa-solid fa-bars"></i>
            </button>
            <div class="cursor-pointer font-extrabold text-lg" onclick="window.location.href='index.html'">
                <span class="text-[#ff5500]">7</span><span class="text-white">ANIME 🔥</span>
            </div>
        </div>
        <div class="search-box relative">
            <input type="text" id="globalSearchInput" placeholder="Search anime..." class="bg-[#1a1a2b] text-xs px-3 py-1.5 rounded-lg border border-gray-700 text-white focus:outline-none w-40 md:w-56">
            <div id="searchResultsDropdown" class="search-dropdown" style="display: none;"></div>
        </div>
    </header>

    <!-- Sidebar Drawer -->
    <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>
    <aside class="sidebar" id="sidebar">
        <div class="flex items-center justify-between p-4 border-b border-gray-800">
            <h3 class="font-bold text-sm"><i class="fa-solid fa-fire text-[#ff5500]"></i> Menu</h3>
            <span class="cursor-pointer text-xl text-gray-400 hover:text-white" onclick="toggleSidebar()">&times;</span>
        </div>
        <ul class="p-4 space-y-3 text-xs font-semibold">
            <li><a href="index.html" class="flex items-center space-x-2 text-gray-300 hover:text-[#ff5500]"><i class="fa-solid fa-house"></i> <span>HOME</span></a></li>
            <li><a href="download.html?page=solo_leveling_videoplayer.html" class="flex items-center space-x-2 text-gray-300 hover:text-[#ff5500]"><i class="fa-solid fa-download"></i> <span>DOWNLOAD PAGE</span></a></li>
        </ul>
    </aside>

    <!-- Main Section -->
    <main class="max-w-7xl mx-auto px-4 py-6 space-y-6">
        <div class="bg-[#151522] border border-gray-800 rounded-2xl p-4 md:p-6 flex flex-col md:flex-row gap-6 items-start shadow-xl">
            <div class="w-full md:w-48 flex-shrink-0 aspect-[3/4] rounded-xl overflow-hidden border border-gray-700 shadow-lg relative mx-auto md:mx-0">
                <img id="animePoster" src="https://lh3.googleusercontent.com/d/1hZPMLLUNMOVG8DmSd1eGd5Nmdgh6AUYZ" alt="Solo Leveling Hindi Dub" class="w-full h-full object-cover">
            </div>
            <div class="flex-1 space-y-3 w-full">
                <div class="flex flex-wrap items-center justify-between gap-2">
                    <h1 id="animeTitle" class="text-2xl md:text-3xl font-extrabold tracking-tight">Solo Leveling (Hindi Official Audio)</h1>
                    <button onclick="window.location.href='download.html?page=solo_leveling_videoplayer.html'" class="bg-[#ff5500] hover:bg-[#e04c00] text-white px-3.5 py-1.5 rounded-lg text-xs font-semibold flex items-center space-x-1.5 transition cursor-pointer">
                        <i class="fa-solid fa-download text-[10px]"></i> <span>All Download Links</span>
                    </button>
                </div>
                <div class="flex flex-wrap items-center gap-2 text-xs">
                    <span class="bg-purple-600/30 text-purple-300 border border-purple-500/40 px-2.5 py-0.5 rounded font-semibold">Hindi Dub</span>
                    <span class="bg-amber-500/20 text-amber-400 border border-amber-500/40 px-2.5 py-0.5 rounded font-bold flex items-center space-x-1">
                        <i class="fa-solid fa-star text-[10px]"></i> <span>9.4/10</span>
                    </span>
                    <span id="activeSeasonBadge" class="bg-[#1a1a2b] text-gray-300 border border-gray-700 px-2.5 py-0.5 rounded">Season 1</span>
                </div>
                <p id="animeDescription" class="text-gray-300 text-xs md:text-sm leading-relaxed">
                    Solo Leveling Official Hindi Audio. Watch Sung Jin-Woo level up in real time.
                </p>
            </div>
        </div>

        <!-- Video Player Grid -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <div class="lg:col-span-2 space-y-4">
                <div class="flex flex-col sm:flex-row sm:items-center justify-between bg-[#151522] px-4 py-2.5 rounded-xl border border-gray-800 gap-3">
                    <div class="flex items-center space-x-2">
                        <span class="text-xs text-gray-400 font-semibold"><i class="fa-solid fa-server text-[#ff5500]"></i> Server:</span>
                        <button class="bg-[#ff5500] text-white px-3 py-1 rounded-lg text-xs font-bold transition shadow">Server 1 (Vidhide)</button>
                    </div>
                </div>

                <!-- Video Frame -->
                <div class="relative bg-black rounded-2xl overflow-hidden shadow-2xl border border-gray-800">
                    <div class="relative aspect-video w-full bg-black flex items-center justify-center" id="playerContainer">
                        <div id="loadingSpinner" class="absolute inset-0 bg-[#0b0c10] flex flex-col items-center justify-center z-20">
                            <div class="spinner mb-3"></div>
                            <p class="text-xs text-gray-400 font-medium tracking-wide">Loading video fast...</p>
                        </div>
                        <iframe id="animeVideoPlayer" src="" class="w-full h-full border-0 absolute inset-0 z-10" allow="autoplay; encrypted-media" allowfullscreen scrolling="no" onload="hideSpinner()" onerror="handleVideoError()"></iframe>
                    </div>
                </div>

                <!-- Player Actions -->
                <div class="flex flex-wrap items-center justify-between bg-[#151522] px-4 py-3 rounded-xl border border-gray-800 text-xs md:text-sm gap-2">
                    <button onclick="changeEpisode('prev')" class="flex items-center space-x-1.5 font-semibold text-gray-300 hover:text-white transition cursor-pointer">
                        <i class="fa-solid fa-chevron-left text-[10px]"></i> <span>Prev Episode</span>
                    </button>
                    
                    <div class="flex items-center space-x-2">
                        <span id="currentPlayingText" class="font-bold text-gray-200">Episode 1</span>
                        
                        <button onclick="downloadCurrentVideo()" class="bg-[#ff5500] hover:bg-[#e04c00] text-white px-3 py-1 rounded-lg text-xs font-bold transition flex items-center space-x-1.5 cursor-pointer shadow">
                            <i class="fa-solid fa-download text-[11px]"></i>
                            <span>Download Video</span>
                        </button>

                        <button onclick="reportBrokenLink()" class="bg-red-600/20 hover:bg-red-600/40 text-red-400 border border-red-500/30 px-2.5 py-1 rounded-lg text-xs font-semibold transition flex items-center space-x-1 cursor-pointer">
                            <i class="fa-solid fa-triangle-exclamation text-[11px]"></i>
                            <span class="hidden sm:inline">Report Dead Link</span>
                        </button>
                    </div>

                    <button onclick="changeEpisode('next')" class="flex items-center space-x-1.5 font-semibold text-gray-300 hover:text-white transition cursor-pointer">
                        <span>Next Episode</span> <i class="fa-solid fa-chevron-right text-[10px]"></i>
                    </button>
                </div>
            </div>

            <!-- Episodes & Season Selection -->
            <div class="bg-[#151522] p-4 rounded-2xl border border-gray-800 space-y-4">
                <div class="flex items-center justify-between border-b border-gray-800 pb-2">
                    <h3 class="font-bold text-sm"><i class="fa-solid fa-layer-group text-[#ff5500]"></i> Select Season</h3>
                    <div class="flex items-center space-x-2" id="seasonButtonsContainer">
                        <!-- Dynamic Season Buttons render here -->
                    </div>
                </div>

                <h3 class="font-bold text-sm"><i class="fa-solid fa-bars text-[#ff5500]"></i> Episode List</h3>
                <div class="grid grid-cols-3 gap-2 overflow-y-auto max-h-[300px] pr-1" id="episodeGridButtons">
                    <!-- Dynamic Episode Buttons render here -->
                </div>
            </div>
        </div>
    </main>

    <script>
        const BACKEND_URL = "https://vidhide-downloader-backend.onrender.com";
        const NOTIFICATION_EMAIL = "sumitguptagupta095@gmail.com";

        // Local Fallback Data (Agar backend API live na ho)
        let animeData = {
            "seasons": {
                "1": [
                    { "ep": 1, "vidhide": "https://vidhidepro.com/embed/enianumkn5s8?autoplay=1" },
                    { "ep": 2, "vidhide": "https://vidhidepro.com/embed/sb7pjd72e1s9?autoplay=1" },
                    { "ep": 3, "vidhide": "https://vidhidepro.com/embed/cnan1gf2g8t7?autoplay=1" },
                    { "ep": 4, "vidhide": "https://vidhidepro.com/embed/t0dge5xo5zrl?autoplay=1" },
                    { "ep": 5, "vidhide": "https://vidhidepro.com/embed/foaoioos27ap?autoplay=1" },
                    { "ep": 6, "vidhide": "https://vidhidepro.com/embed/m7jjs2sr03kw?autoplay=1" },
                    { "ep": 7, "vidhide": "https://vidhidepro.com/embed/gs06s2v6r673?autoplay=1" },
                    { "ep": 8, "vidhide": "https://vidhidepro.com/embed/xh0iyd50hvq6?autoplay=1" },
                    { "ep": 9, "vidhide": "https://vidhidepro.com/embed/bouhhv2xlb31?autoplay=1" },
                    { "ep": 10, "vidhide": "https://vidhidepro.com/embed/og1ex9uwb2m7?autoplay=1" },
                    { "ep": 11, "vidhide": "https://vidhidepro.com/embed/lhddo4tv4yyy?autoplay=1" },
                    { "ep": 12, "vidhide": "https://vidhidepro.com/embed/zvhhe7ig5duq?autoplay=1" }
                ],
                "2": [] // Jab aap S2 ka video upload karenge, yahan automatic list banegi
            }
        };

        let currentSeason = 1;
        let activeEpisodeNumber = 1;
        let activeEmbedLink = "";

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('active');
            document.getElementById('sidebarOverlay').classList.toggle('active');
        }

        function hideSpinner() {
            const spinner = document.getElementById('loadingSpinner');
            if (spinner) spinner.style.display = 'none';
        }

        function showSpinner() {
            const spinner = document.getElementById('loadingSpinner');
            if (spinner) spinner.style.display = 'flex';
        }

        function extractVidhideCode(url) {
            if (!url) return null;
            const match = url.match(/\/(?:embed|d)\/([a-zA-Z0-9]+)/);
            return match ? match[1] : null;
        }

        // Render Seasons dynamically
        function renderSeasons() {
            const container = document.getElementById('seasonButtonsContainer');
            container.innerHTML = '';

            Object.keys(animeData.seasons).forEach(seasonNum => {
                const isSelected = parseInt(seasonNum) === currentSeason;
                const btn = document.createElement('button');
                btn.className = isSelected 
                    ? "bg-[#ff5500] text-white px-3 py-1 rounded-lg text-xs font-bold transition shadow cursor-pointer"
                    : "bg-[#1a1a2b] hover:bg-gray-800 text-gray-300 border border-gray-700 px-3 py-1 rounded-lg text-xs font-semibold transition cursor-pointer";
                btn.innerText = `Season ${seasonNum}`;
                btn.onclick = () => switchSeason(parseInt(seasonNum));
                container.appendChild(btn);
            });
        }

        // Switch active Season
        function switchSeason(seasonNum) {
            currentSeason = seasonNum;
            document.getElementById('activeSeasonBadge').innerText = `Season ${seasonNum}`;
            renderSeasons();
            renderEpisodes();
            if (animeData.seasons[currentSeason] && animeData.seasons[currentSeason].length > 0) {
                selectEpisode(animeData.seasons[currentSeason][0].ep);
            }
        }

        // Render Episodes dynamically
        function renderEpisodes() {
            const container = document.getElementById('episodeGridButtons');
            container.innerHTML = '';

            const episodes = animeData.seasons[currentSeason] || [];

            if(episodes.length === 0) {
                container.innerHTML = `<p class="col-span-3 text-xs text-gray-400 py-4 text-center">No episodes uploaded yet for Season ${currentSeason}.</p>`;
                return;
            }

            episodes.forEach(item => {
                const btn = document.createElement('button');
                btn.className = `ep-btn bg-[#1a1a2b] hover:bg-[#ff5500]/30 border border-gray-700 py-2.5 rounded-lg text-xs font-medium transition cursor-pointer`;
                btn.setAttribute('data-ep', item.ep);
                btn.setAttribute('data-vidhide', item.vidhide);
                btn.innerText = item.ep;
                btn.onclick = () => selectEpisode(item.ep);
                container.appendChild(btn);
            });
        }

        function selectEpisode(epNum) {
            const episodes = animeData.seasons[currentSeason] || [];
            const epData = episodes.find(e => e.ep === epNum);
            if (!epData) return;

            showSpinner();
            activeEpisodeNumber = epNum;
            activeEmbedLink = epData.vidhide;

            const iframe = document.getElementById('animeVideoPlayer');
            iframe.src = epData.vidhide;

            document.getElementById('currentPlayingText').innerText = `S${currentSeason} Ep ${epNum}`;

            document.querySelectorAll('.ep-btn').forEach(b => {
                const bEp = parseInt(b.getAttribute('data-ep'));
                if (bEp === epNum) {
                    b.className = "ep-btn bg-[#ff5500] text-white border border-[#ff5500] py-2.5 rounded-lg text-xs font-bold transition cursor-pointer";
                } else {
                    b.className = "ep-btn bg-[#1a1a2b] hover:bg-[#ff5500]/30 border border-gray-700 py-2.5 rounded-lg text-xs font-medium transition cursor-pointer";
                }
            });
        }

        function changeEpisode(direction) {
            const episodes = animeData.seasons[currentSeason] || [];
            const currentIndex = episodes.findIndex(e => e.ep === activeEpisodeNumber);

            if (direction === 'prev' && currentIndex > 0) {
                selectEpisode(episodes[currentIndex - 1].ep);
            } else if (direction === 'next' && currentIndex < episodes.length - 1) {
                selectEpisode(episodes[currentIndex + 1].ep);
            }
        }

        async function downloadCurrentVideo() {
            const fileCode = extractVidhideCode(activeEmbedLink);
            if (!fileCode) {
                alert("Valid video link not found!");
                return;
            }

            const newTab = window.open('about:blank', '_blank');
            if (newTab) {
                newTab.document.write('<body style="background:#0f0f1a;color:#fff;font-family:sans-serif;display:flex;justify-content:center;align-items:center;height:100vh;margin:0;"><h3>Connecting to Render Backend...</h3></body>');
            }

            try {
                const response = await fetch(`${BACKEND_URL}/get-download-link?code=${fileCode}`);
                const data = await response.json();

                if (data.success && data.download_url) {
                    if (newTab) newTab.location.href = data.download_url;
                    else window.location.href = data.download_url;
                } else {
                    const fallback = `https://vidhidepro.com/d/${fileCode}`;
                    if (newTab) newTab.location.href = fallback;
                }
            } catch (error) {
                const fallback = `https://vidhidepro.com/d/${fileCode}`;
                if (newTab) newTab.location.href = fallback;
            }
        }

        function sendEmailAlert(epNum, linkUrl, reason) {
            fetch(`https://formsubmit.co/ajax/${NOTIFICATION_EMAIL}`, {
                method: "POST",
                headers: { "Content-Type": "application/json", "Accept": "application/json" },
                body: JSON.stringify({
                    _subject: `⚠️ Dead Link Alert: Solo Leveling S${currentSeason} Ep ${epNum}`,
                    Anime: "Solo Leveling",
                    Season: currentSeason,
                    Episode: epNum,
                    Broken_Link: linkUrl,
                    Reason: reason,
                    Time: new Date().toLocaleString()
                })
            });
        }

        function reportBrokenLink() {
            if (confirm(`S${currentSeason} Episode ${activeEpisodeNumber} ka link report karein?`)) {
                sendEmailAlert(activeEpisodeNumber, activeEmbedLink, "User Reported Broken Video");
                alert("Report Send Ho Gayi Hai!");
            }
        }

        function handleVideoError() {
            hideSpinner();
            sendEmailAlert(activeEpisodeNumber, activeEmbedLink, "Iframe Load Failed");
        }

        // Auto Fetch New Uploads from Render Backend / API
        async function fetchLatestAnimeData() {
            try {
                const res = await fetch(`${BACKEND_URL}/api/solo-leveling`);
                if (res.ok) {
                    const remoteData = await res.json();
                    if (remoteData && remoteData.seasons) {
                        animeData = remoteData;
                    }
                }
            } catch(e) {
                console.log("Using built-in data. Backend offline or API endpoint not setup.");
            }
            renderSeasons();
            renderEpisodes();
            selectEpisode(1);
        }

        document.addEventListener('DOMContentLoaded', fetchLatestAnimeData);
    </script>
</body>
</html>
