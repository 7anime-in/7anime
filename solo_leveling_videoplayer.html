<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle">7ANIME - Watch Anime</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .spinner {
            width: 45px;
            height: 45px;
            border: 4px solid rgba(255, 85, 0, 0.2);
            border-top: 4px solid #ff5500;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .sidebar {
            position: fixed;
            top: 0;
            left: -280px;
            width: 280px;
            height: 100%;
            background-color: #151522;
            z-index: 100;
            transition: left 0.3s ease;
            box-shadow: 5px 0 15px rgba(0,0,0,0.5);
            border-right: 1px solid #2d2d3d;
        }
        .sidebar.active { left: 0; }
        .sidebar-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            z-index: 99;
            display: none;
        }
        .sidebar-overlay.active { display: block; }
    </style>
</head>
<body class="bg-[#0b0c10] text-white font-sans antialiased">

    <!-- Header / Navbar -->
    <header class="main-header flex items-center justify-between px-4 py-3 bg-[#151522] border-b border-gray-800 relative z-50">
        <div class="flex items-center space-x-3">
            <button class="text-white text-lg focus:outline-none cursor-pointer" id="menuBtn" onclick="toggleSidebar()">
                <i class="fa-solid fa-bars"></i>
            </button>
            <div class="cursor-pointer font-extrabold text-lg" onclick="window.location.href='index.html'">
                <span class="text-[#ff5500]">7</span><span class="text-white">ANIME 🔥</span>
            </div>
        </div>
        <div class="search-box relative">
            <input type="text" id="globalSearchInput" placeholder="Search anime..." class="bg-[#1a1a2b] text-xs px-3 py-1.5 rounded-lg border border-gray-700 text-white focus:outline-none w-40 md:w-56">
        </div>
    </header>

    <!-- Sidebar Drawer -->
    <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>
    <aside class="sidebar" id="sidebar">
        <div class="flex items-center justify-between p-4 border-b border-gray-800">
            <h3 class="font-bold text-sm"><i class="fa-solid fa-fire text-[#ff5500]"></i> Menu</h3>
            <span class="cursor-pointer text-xl text-gray-400 hover:text-white" onclick="toggleSidebar()">&times;</span>
        </div>
        <ul class="p-4 space-y-3 text-xs font-semibold">
            <li><a href="index.html" class="flex items-center space-x-2 text-gray-300 hover:text-[#ff5500]"><i class="fa-solid fa-house"></i> <span>HOME</span></a></li>
            <li><a href="index.html" class="flex items-center space-x-2 text-gray-300 hover:text-[#ff5500]"><i class="fa-solid fa-download"></i> <span>ALL ANIMES</span></a></li>
        </ul>
    </aside>

    <!-- Main Section -->
    <main class="max-w-7xl mx-auto px-4 py-6 space-y-6">
        <div class="bg-[#151522] border border-gray-800 rounded-2xl p-4 md:p-6 flex flex-col md:flex-row gap-6 items-start shadow-xl">
            <div class="w-full md:w-48 flex-shrink-0 aspect-[3/4] rounded-xl overflow-hidden border border-gray-700 shadow-lg relative mx-auto md:mx-0">
                <img id="animePoster" src="https://lh3.googleusercontent.com/d/1hZPMLLUNMOVG8DmSd1eGd5Nmdgh6AUYZ" alt="Anime Poster" class="w-full h-full object-cover">
            </div>
            <div class="flex-1 space-y-3 w-full">
                <div class="flex flex-wrap items-center justify-between gap-2">
                    <h1 id="animeTitleDisplay" class="text-2xl md:text-3xl font-extrabold tracking-tight">Loading Anime...</h1>
                    <button onclick="downloadCurrentVideo()" class="bg-[#ff5500] hover:bg-[#e04c00] text-white px-3.5 py-1.5 rounded-lg text-xs font-semibold flex items-center space-x-1.5 transition cursor-pointer">
                        <i class="fa-solid fa-download text-[10px]"></i> <span>Download Episode</span>
                    </button>
                </div>
                <div class="flex flex-wrap items-center gap-2 text-xs">
                    <span class="bg-purple-600/30 text-purple-300 border border-purple-500/40 px-2.5 py-0.5 rounded font-semibold">Hindi Dub</span>
                    <span class="bg-amber-500/20 text-amber-400 border border-amber-500/40 px-2.5 py-0.5 rounded font-bold flex items-center space-x-1">
                        <i class="fa-solid fa-star text-[10px]"></i> <span>9.4/10</span>
                    </span>
                    <span id="activeSeasonBadge" class="bg-[#1a1a2b] text-gray-300 border border-gray-700 px-2.5 py-0.5 rounded">Season 1</span>
                </div>
                <p id="animeDescription" class="text-gray-300 text-xs md:text-sm leading-relaxed">
                    Watch and download high-quality episodes directly from our fast streaming servers.
                </p>
            </div>
        </div>

        <!-- Video Player Grid -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <div class="lg:col-span-2 space-y-4">
                <div class="flex flex-col sm:flex-row sm:items-center justify-between bg-[#151522] px-4 py-2.5 rounded-xl border border-gray-800 gap-3">
                    <div class="flex items-center space-x-2">
                        <span class="text-xs text-gray-400 font-semibold"><i class="fa-solid fa-server text-[#ff5500]"></i> Server:</span>
                        <button class="bg-[#ff5500] text-white px-3 py-1 rounded-lg text-xs font-bold transition shadow">Fast Stream Engine</button>
                    </div>
                </div>

                <!-- Video Frame -->
                <div class="relative bg-black rounded-2xl overflow-hidden shadow-2xl border border-gray-800">
                    <div class="relative aspect-video w-full bg-black flex items-center justify-center" id="playerContainer">
                        <div id="loadingSpinner" class="absolute inset-0 bg-[#0b0c10] flex flex-col items-center justify-center z-20">
                            <div class="spinner mb-3"></div>
                            <p class="text-xs text-gray-400 font-medium tracking-wide">Connecting to Fast Stream Server...</p>
                        </div>
                        
                        <video id="animeVideoPlayer" controls controlsList="nodownload" preload="metadata" class="w-full h-full object-contain absolute inset-0 z-10 bg-black" onloadeddata="hideSpinner()" oncanplay="hideSpinner()" onplaying="hideSpinner()" onerror="handleVideoError()">
                            Your browser does not support HTML5 video streaming.
                        </video>
                    </div>
                </div>

                <!-- Player Controls -->
                <div class="flex flex-wrap items-center justify-between bg-[#151522] px-4 py-3 rounded-xl border border-gray-800 text-xs md:text-sm gap-2">
                    <button onclick="changeEpisode('prev')" class="flex items-center space-x-1.5 font-semibold text-gray-300 hover:text-white transition cursor-pointer">
                        <i class="fa-solid fa-chevron-left text-[10px]"></i> <span>Prev Episode</span>
                    </button>
                    
                    <div class="flex items-center space-x-2">
                        <span id="currentPlayingText" class="font-bold text-gray-200">Episode 1</span>
                        
                        <button onclick="downloadCurrentVideo()" class="bg-[#ff5500] hover:bg-[#e04c00] text-white px-3 py-1 rounded-lg text-xs font-bold transition flex items-center space-x-1.5 cursor-pointer shadow">
                            <i class="fa-solid fa-download text-[11px]"></i>
                            <span>Download Video</span>
                        </button>

                        <button onclick="reportBrokenLink()" class="bg-red-600/20 hover:bg-red-600/40 text-red-400 border border-red-500/30 px-2.5 py-1 rounded-lg text-xs font-semibold transition flex items-center space-x-1 cursor-pointer">
                            <i class="fa-solid fa-triangle-exclamation text-[11px]"></i>
                            <span class="hidden sm:inline">Report Dead Link</span>
                        </button>
                    </div>

                    <button onclick="changeEpisode('next')" class="flex items-center space-x-1.5 font-semibold text-gray-300 hover:text-white transition cursor-pointer">
                        <span>Next Episode</span> <i class="fa-solid fa-chevron-right text-[10px]"></i>
                    </button>
                </div>
            </div>

            <!-- Audio Dub Switch, Season Selection & Episode Buttons -->
            <div class="bg-[#151522] p-4 rounded-2xl border border-gray-800 space-y-4">
                
                <!-- DUBBING SWITCH: OFFICIAL VS UNOFFICIAL -->
                <div>
                    <span class="text-xs text-gray-400 font-semibold block mb-2"><i class="fa-solid fa-sliders text-[#ff5500]"></i> Select Audio Version:</span>
                    <div class="grid grid-cols-2 gap-2 bg-[#1a1a2b] p-1.5 rounded-xl border border-gray-800">
                        <button id="dubOfficialBtn" onclick="switchDubType('official')" class="py-1.5 rounded-lg text-xs font-bold transition cursor-pointer bg-[#ff5500] text-white shadow">
                            ✨ Official
                        </button>
                        <button id="dubUnofficialBtn" onclick="switchDubType('unofficial')" class="py-1.5 rounded-lg text-xs font-bold transition cursor-pointer text-gray-400 hover:text-white">
                            🎧 FanDub
                        </button>
                    </div>
                </div>

                <hr class="border-gray-800/80">

                <!-- Season Selection -->
                <div>
                    <span class="text-xs text-gray-400 font-semibold block mb-2"><i class="fa-solid fa-layer-group text-[#ff5500]"></i> Select Season:</span>
                    <div id="seasonButtonsContainer" class="flex flex-wrap gap-2"></div>
                </div>

                <hr class="border-gray-800/80">

                <h3 class="font-bold text-sm"><i class="fa-solid fa-bars text-[#ff5500]"></i> Episode List</h3>
                <div class="grid grid-cols-3 gap-2 overflow-y-auto max-h-[350px] pr-1" id="episodeGridButtons"></div>
            </div>
        </div>
    </main>

    <script>
        const BACKEND_URL = "https://sevenanime-http-bot.onrender.com";
        const NOTIFICATION_EMAIL = "sumitguptagupta095@gmail.com";

        let currentAnimeData = null;
        let activeSeason = "1";
        let activeDubType = "official"; // 'official' or 'unofficial'
        let activeEpisodeIndex = 0;
        let activeChatId = "";
        let activeMsgId = "";
        let filteredEpisodes = [];

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('active');
            document.getElementById('sidebarOverlay').classList.toggle('active');
        }

        function hideSpinner() {
            const spinner = document.getElementById('loadingSpinner');
            if (spinner) spinner.style.display = 'none';
        }

        function showSpinner() {
            const spinner = document.getElementById('loadingSpinner');
            if (spinner) spinner.style.display = 'flex';
        }

        async function initPage() {
            const urlParams = new URLSearchParams(window.location.search);
            const animeSlug = urlParams.get('anime') || 'solo_leveling';

            try {
                showSpinner();
                const response = await fetch(`${BACKEND_URL}/api/episodes/${animeSlug}`);
                currentAnimeData = await response.json();

                if (currentAnimeData && currentAnimeData.title) {
                    document.getElementById('animeTitleDisplay').innerText = currentAnimeData.title;
                    document.getElementById('pageTitle').innerText = `${currentAnimeData.title} - 7ANIME`;
                }

                renderSeasons();
                selectSeason(activeSeason);
            } catch (err) {
                console.error("Error fetching anime details:", err);
                alert("Anime data fetch karne me error aaya.");
            }
        }

        function switchDubType(type) {
            activeDubType = type;

            const officialBtn = document.getElementById('dubOfficialBtn');
            const unofficialBtn = document.getElementById('dubUnofficialBtn');

            if (type === 'official') {
                officialBtn.className = "py-1.5 rounded-lg text-xs font-bold transition cursor-pointer bg-[#ff5500] text-white shadow";
                unofficialBtn.className = "py-1.5 rounded-lg text-xs font-bold transition cursor-pointer text-gray-400 hover:text-white";
            } else {
                unofficialBtn.className = "py-1.5 rounded-lg text-xs font-bold transition cursor-pointer bg-[#ff5500] text-white shadow";
                officialBtn.className = "py-1.5 rounded-lg text-xs font-bold transition cursor-pointer text-gray-400 hover:text-white";
            }

            renderEpisodes();
        }

        function renderSeasons() {
            const container = document.getElementById('seasonButtonsContainer');
            container.innerHTML = "";

            if (!currentAnimeData || !currentAnimeData.seasons) return;

            const seasonKeys = Object.keys(currentAnimeData.seasons);
            if (seasonKeys.length === 0) {
                container.innerHTML = `<span class="text-xs text-gray-400">No seasons available</span>`;
                return;
            }

            if (!seasonKeys.includes(activeSeason)) {
                activeSeason = seasonKeys[0];
            }

            seasonKeys.forEach(sNum => {
                const btn = document.createElement('button');
                btn.className = `px-3 py-1 rounded-lg text-xs font-bold transition cursor-pointer ${sNum === activeSeason ? 'bg-[#ff5500] text-white' : 'bg-[#1a1a2b] text-gray-300 border border-gray-700 hover:bg-[#ff5500]/20'}`;
                btn.innerText = `Season ${sNum}`;
                btn.onclick = () => selectSeason(sNum);
                container.appendChild(btn);
            });
        }

        function selectSeason(seasonNum) {
            activeSeason = seasonNum;
            document.getElementById('activeSeasonBadge').innerText = `Season ${seasonNum}`;
            renderSeasons();
            renderEpisodes();
        }

        function renderEpisodes() {
            const grid = document.getElementById('episodeGridButtons');
            grid.innerHTML = "";

            const rawEpList = currentAnimeData?.seasons?.[activeSeason] || [];

            filteredEpisodes = rawEpList.filter(ep => (ep.type || 'official') === activeDubType);

            if (filteredEpisodes.length === 0) {
                grid.innerHTML = `<p class="col-span-3 text-xs text-gray-400 py-4 text-center">Is category (${activeDubType.toUpperCase()}) me episodes nahi hain.</p>`;
                hideSpinner();
                return;
            }

            filteredEpisodes.forEach((epItem, index) => {
                const btn = document.createElement('button');
                btn.className = `ep-btn py-2.5 rounded-lg text-xs font-medium transition cursor-pointer ${index === activeEpisodeIndex ? 'bg-[#ff5500] text-white border border-[#ff5500] font-bold' : 'bg-[#1a1a2b] hover:bg-[#ff5500]/30 border border-gray-700 text-gray-300'}`;
                btn.innerText = epItem.ep;
                btn.onclick = () => playEpisode(index);
                grid.appendChild(btn);
            });

            if (filteredEpisodes.length > 0) {
                playEpisode(0);
            }
        }

        function playEpisode(index) {
            if (!filteredEpisodes[index]) return;

            activeEpisodeIndex = index;
            const epData = filteredEpisodes[index];

            activeChatId = epData.chat_id;
            activeMsgId = epData.msg_id;

            showSpinner();

            const cleanChatId = activeChatId.replace(/^@/, '');
            const streamUrl = `${BACKEND_URL}/stream/${encodeURIComponent(cleanChatId)}/${activeMsgId}.mp4`;
            const videoPlayer = document.getElementById('animeVideoPlayer');

            videoPlayer.src = streamUrl;
            videoPlayer.load();

            setTimeout(() => { hideSpinner(); }, 5000);

            videoPlayer.play().catch((err) => {
                console.log("Autoplay blocked or waiting for play click:", err);
            });

            document.getElementById('currentPlayingText').innerText = `Episode ${epData.ep}`;
            renderEpisodesUIOnly();
        }

        function renderEpisodesUIOnly() {
            const buttons = document.querySelectorAll('.ep-btn');
            buttons.forEach((btn, idx) => {
                if (idx === activeEpisodeIndex) {
                    btn.className = 'ep-btn bg-[#ff5500] text-white border border-[#ff5500] py-2.5 rounded-lg text-xs font-bold transition cursor-pointer';
                } else {
                    btn.className = 'ep-btn bg-[#1a1a2b] hover:bg-[#ff5500]/30 border border-gray-700 py-2.5 rounded-lg text-xs font-medium text-gray-300 transition cursor-pointer';
                }
            });
        }

        function changeEpisode(direction) {
            if (direction === 'prev' && activeEpisodeIndex > 0) {
                playEpisode(activeEpisodeIndex - 1);
            } else if (direction === 'next' && activeEpisodeIndex < filteredEpisodes.length - 1) {
                playEpisode(activeEpisodeIndex + 1);
            }
        }

        function downloadCurrentVideo() {
            if (!activeChatId || !activeMsgId) {
                alert("Koi video active nahi hai download ke liye.");
                return;
            }
            const cleanChatId = activeChatId.replace(/^@/, '');
            window.location.href = `${BACKEND_URL}/download/${encodeURIComponent(cleanChatId)}/${activeMsgId}`;
        }

        function sendEmailAlert(epNum, reason) {
            fetch(`https://formsubmit.co/ajax/${NOTIFICATION_EMAIL}`, {
                method: "POST",
                headers: { "Content-Type": "application/json", "Accept": "application/json" },
                body: JSON.stringify({
                    _subject: `⚠️ Dead Link / Playback Error Alert`,
                    Anime: currentAnimeData?.title || "Unknown",
                    Season: activeSeason,
                    Type: activeDubType,
                    Episode: epNum,
                    Reason: reason,
                    Time: new Date().toLocaleString()
                })
            });
        }

        function reportBrokenLink() {
            const epNum = filteredEpisodes[activeEpisodeIndex]?.ep || (activeEpisodeIndex + 1);
            if (confirm(`Episode ${epNum} ko report karein?`)) {
                sendEmailAlert(epNum, "User Reported Dead Video");
                alert("Report successfully send ho gayi hai!");
            }
        }

function handleVideoError() {
            hideSpinner();
            const epNum = filteredEpisodes[activeEpisodeIndex]?.ep || (activeEpisodeIndex + 1);
            sendEmailAlert(epNum, "Video Loading Failed");
        }

        window.onload = initPage;
    </script>
</body>
</html>
