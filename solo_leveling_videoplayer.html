<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solo Leveling - 7ANIME</title>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom Spinner Animation for Fast Loading Feedback */
        .spinner {
            width: 45px;
            height: 45px;
            border: 4px solid rgba(255, 85, 0, 0.2);
            border-top: 4px solid #ff5500;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="bg-[#0b0c10] text-white font-sans antialiased">

    <!-- Header / Navbar -->
    <header class="main-header flex items-center justify-between px-4 py-3 bg-[#151522] border-b border-gray-800">
        <div class="flex items-center space-x-3">
            <button class="text-white text-lg focus:outline-none" id="menuBtn" onclick="toggleSidebar()">
                <i class="fa-solid fa-bars"></i>
            </button>
            <div class="cursor-pointer font-extrabold text-lg" onclick="window.location.href='index.html'">
                <span class="text-[#ff5500]">7</span><span class="text-white">ANIME 🔥</span>
            </div>
        </div>
        <div class="flex items-center space-x-3">
            <input type="text" id="globalSearchInput" placeholder="Search anime..." class="bg-[#1a1a2b] text-xs px-3 py-1.5 rounded-lg border border-gray-700 text-white focus:outline-none">
        </div>
    </header>

    <!-- Main Wrapper Content -->
    <main class="max-w-7xl mx-auto px-4 py-6 space-y-6">

        <!-- Anime Details Header Section -->
        <div class="bg-[#151522] border border-gray-800 rounded-2xl p-4 md:p-6 flex flex-col md:flex-row gap-6 items-start shadow-xl">
            <div class="w-full md:w-48 flex-shrink-0 aspect-[3/4] rounded-xl overflow-hidden border border-gray-700 shadow-lg relative mx-auto md:mx-0">
                <img src="https://lh3.googleusercontent.com/d/1hZPMLLUNMOVG8DmSd1eGd5Nmdgh6AUYZ" alt="Solo Leveling" class="w-full h-full object-cover">
            </div>
            <div class="flex-1 space-y-3 w-full">
                <div class="flex flex-wrap items-center justify-between gap-2">
                    <h1 class="text-2xl md:text-3xl font-extrabold tracking-tight">Solo Leveling</h1>
                </div>
                <div class="flex flex-wrap items-center gap-2 text-xs">
                    <span class="bg-purple-600/30 text-purple-300 border border-purple-500/40 px-2.5 py-0.5 rounded font-semibold">Anime</span>
                    <span class="bg-amber-500/20 text-amber-400 border border-amber-500/40 px-2.5 py-0.5 rounded font-bold flex items-center space-x-1">
                        <i class="fa-solid fa-star text-[10px]"></i> <span>9.4/10</span>
                    </span>
                    <span class="bg-[#1a1a2b] text-gray-300 border border-gray-700 px-2.5 py-0.5 rounded">Rank #1</span>
                </div>
                <p class="text-gray-300 text-xs md:text-sm leading-relaxed">
                    Sung Jin-Woo continues his journey to become the strongest hunter in a world full of monsters and hidden secrets.
                </p>
            </div>
        </div>

        <!-- Video Player & Episode List Grid Section -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">

            <!-- Video Player + Server Switcher -->
            <div class="lg:col-span-2 space-y-4">
                
                <!-- Server Switcher Tabs -->
                <div class="flex items-center justify-between bg-[#151522] px-4 py-2.5 rounded-xl border border-gray-800">
                    <span class="text-xs text-gray-400 font-semibold"><i class="fa-solid fa-server text-[#ff5500]"></i> Choose Server:</span>
                    <div class="flex items-center space-x-2">
                        <button onclick="switchServer('vidhide')" id="serverBtn1" class="bg-[#ff5500] text-white px-3 py-1 rounded-lg text-xs font-bold transition shadow">Server 1 (Vidhide)</button>
                        <button onclick="switchServer('streamwish')" id="serverBtn2" class="bg-[#1a1a2b] hover:bg-gray-800 text-gray-300 border border-gray-700 px-3 py-1 rounded-lg text-xs font-semibold transition">Server 2 (Streamwish)</button>
                    </div>
                </div>

                <!-- Player Box with Spinner -->
                <div class="relative bg-black rounded-2xl overflow-hidden shadow-2xl border border-gray-800">
                    <div class="relative aspect-video w-full bg-black flex items-center justify-center" id="playerContainer">
                        <!-- Loading Spinner Overlay -->
                        <div id="loadingSpinner" class="absolute inset-0 bg-[#0b0c10] flex flex-col items-center justify-center z-20">
                            <div class="spinner mb-3"></div>
                            <p class="text-xs text-gray-400 font-medium tracking-wide">Loading video fast...</p>
                        </div>
                        <!-- Actual Iframe Player -->
                        <iframe id="animeVideoPlayer" src="" class="w-full h-full border-0 absolute inset-0 z-10" allowfullscreen scrolling="no" onload="hideSpinner()"></iframe>
                    </div>
                </div>

                <!-- Next/Prev Episode Bar -->
                <div class="flex items-center justify-between bg-[#151522] px-4 py-3 rounded-xl border border-gray-800 text-xs md:text-sm">
                    <button onclick="changeEpisode('prev')" class="flex items-center space-x-1.5 font-semibold text-gray-300 hover:text-white transition cursor-pointer">
                        <i class="fa-solid fa-chevron-left text-[10px]"></i>
                        <span>Prev Episode</span>
                    </button>
                    <span id="currentPlayingText" class="font-bold text-gray-200">Episode 1</span>
                    <button onclick="changeEpisode('next')" class="flex items-center space-x-1.5 font-semibold text-gray-300 hover:text-white transition cursor-pointer">
                        <span>Next Episode</span>
                        <i class="fa-solid fa-chevron-right text-[10px]"></i>
                    </button>
                </div>
            </div>

            <!-- Episode List Sidebar -->
            <div class="bg-[#151522] p-4 rounded-2xl border border-gray-800 space-y-4">
                <div class="flex items-center justify-between mb-2">
                    <div class="flex items-center space-x-2">
                        <i class="fa-solid fa-bars text-[#ff5500] text-sm"></i>
                        <h3 class="font-bold text-sm">Episode List</h3>
                    </div>
                </div>
                <div class="grid grid-cols-3 gap-2 overflow-y-auto max-h-[300px] pr-1" id="episodeGridButtons">
                    <!-- Episode Buttons 1 to 12 -->
                    <button onclick="selectEpisode(1)" class="ep-btn bg-[#ff5500] text-white border border-[#ff5500] py-2.5 rounded-lg text-xs font-bold transition" data-ep="1">1</button>
                    <button onclick="selectEpisode(2)" class="ep-btn bg-[#1a1a2b] hover:bg-[#ff5500]/30 border border-gray-700 py-2.5 rounded-lg text-xs font-medium transition" data-ep="2">2</button>
                    <button onclick="selectEpisode(3)" class="ep-btn bg-[#1a1a2b] hover:bg-[#ff5500]/30 border border-gray-700 py-2.5 rounded-lg text-xs font-medium transition" data-ep="3">3</button>
                    <button onclick="selectEpisode(4)" class="ep-btn bg-[#1a1a2b] hover:bg-[#ff5500]/30 border border-gray-700 py-2.5 rounded-lg text-xs font-medium transition" data-ep="4">4</button>
                    <button onclick="selectEpisode(5)" class="ep-btn bg-[#1a1a2b] hover:bg-[#ff5500]/30 border border-gray-700 py-2.5 rounded-lg text-xs font-medium transition" data-ep="5">5</button>
                    <button onclick="selectEpisode(6)" class="ep-btn bg-[#1a1a2b] hover:bg-[#ff5500]/30 border border-gray-700 py-2.5 rounded-lg text-xs font-medium transition" data-ep="6">6</button>
                    <button onclick="selectEpisode(7)" class="ep-btn bg-[#1a1a2b] hover:bg-[#ff5500]/30 border border-gray-700 py-2.5 rounded-lg text-xs font-medium transition" data-ep="7">7</button>
                    <button onclick="selectEpisode(8)" class="ep-btn bg-[#1a1a2b] hover:bg-[#ff5500]/30 border border-gray-700 py-2.5 rounded-lg text-xs font-medium transition" data-ep="8">8</button>
                    <button onclick="selectEpisode(9)" class="ep-btn bg-[#1a1a2b] hover:bg-[#ff5500]/30 border border-gray-700 py-2.5 rounded-lg text-xs font-medium transition" data-ep="9">9</button>
                    <button onclick="selectEpisode(10)" class="ep-btn bg-[#1a1a2b] hover:bg-[#ff5500]/30 border border-gray-700 py-2.5 rounded-lg text-xs font-medium transition" data-ep="10">10</button>
                    <button onclick="selectEpisode(11)" class="ep-btn bg-[#1a1a2b] hover:bg-[#ff5500]/30 border border-gray-700 py-2.5 rounded-lg text-xs font-medium transition" data-ep="11">11</button>
                    <button onclick="selectEpisode(12)" class="ep-btn bg-[#1a1a2b] hover:bg-[#ff5500]/30 border border-gray-700 py-2.5 rounded-lg text-xs font-medium transition" data-ep="12">12</button>
                </div>
            </div>
        </div>
    </main>

    <!-- Script Section -->
    <script>
        // Server 1 Links (Vidhidepro)
        const server1Links = {
            1: 'https://vidhidepro.com/v/ctymcjwnsyvm',
            2: 'https://vidhidepro.com/v/hlt9fthmy03k',
            3: 'https://vidhidepro.com/v/8nd3o2ub9mge',
            4: 'https://vidhidepro.com/v/llo8cbz3vi83',
            5: 'https://vidhidepro.com/v/b5rkepvh66q8',
            6: 'https://vidhidepro.com/v/1g2gg0xu3j57',
            7: 'https://vidhidepro.com/v/63umkeakk4ql',
            8: 'https://vidhidepro.com/v/rbzdmu1tnby2',
            9: 'https://vidhidepro.com/v/ot0emcyiq2di',
            10: 'https://vidhidepro.com/v/jz0lettaf3od',
            11: 'https://vidhidepro.com/v/3845ic0opjl8',
            12: 'https://vidhidepro.com/v/a1gfhtn6e9y1'
        };

        // Server 2 Alternative Links (Streamwish / Filemoon backup - currently mapped for seamless toggle)
        const server2Links = {
            1: 'https://streamwish.to/e/ctymcjwnsyvm',
            2: 'https://streamwish.to/e/hlt9fthmy03k',
            3: 'https://streamwish.to/e/8nd3o2ub9mge',
            4: 'https://streamwish.to/e/llo8cbz3vi83',
            5: 'https://streamwish.to/e/b5rkepvh66q8',
            6: 'https://streamwish.to/e/1g2gg0xu3j57',
            7: 'https://streamwish.to/e/63umkeakk4ql',
            8: 'https://streamwish.to/e/rbzdmu1tnby2',
            9: 'https://streamwish.to/e/ot0emcyiq2di',
            10: 'https://streamwish.to/e/jz0lettaf3od',
            11: 'https://streamwish.to/e/3845ic0opjl8',
            12: 'https://streamwish.to/e/a1gfhtn6e9y1'
        };

        let currentEpisode = 1;
        let currentServer = 'vidhide';

        function loadEpisode() {
            const spinner = document.getElementById('loadingSpinner');
            const iframe = document.getElementById('animeVideoPlayer');
            
            // Show spinner when loading starts
            if (spinner) spinner.style.display = 'flex';

            let link = (currentServer === 'vidhide') ? server1Links[currentEpisode] : server2Links[currentEpisode];
            if (iframe) {
                iframe.src = link;
            }
        }

        function hideSpinner() {
            const spinner = document.getElementById('loadingSpinner');
            if (spinner) spinner.style.display = 'none';
        }

        function selectEpisode(epNum) {
            currentEpisode = epNum;
            const titleText = document.getElementById('currentPlayingText');
            if (titleText) titleText.innerText = "Episode " + epNum;

            loadEpisode();

            // Update active state of episode buttons
            document.querySelectorAll('.ep-btn').forEach(btn => {
                if (parseInt(btn.getAttribute('data-ep')) === epNum) {
                    btn.className = "ep-btn bg-[#ff5500] text-white border border-[#ff5500] py-2.5 rounded-lg text-xs font-bold transition";
                } else {
                    btn.className = "ep-btn bg-[#1a1a2b] hover:bg-[#ff5500]/30 border border-gray-700 py-2.5 rounded-lg text-xs font-medium transition";
                }
            });
        }

        function changeEpisode(direction) {
            if (direction === 'next') {
                currentEpisode = currentEpisode < 12 ? currentEpisode + 1 : 1;
            } else {
                currentEpisode = currentEpisode > 1 ? currentEpisode - 1 : 12;
            }
            selectEpisode(currentEpisode);
        }

        function switchServer(serverName) {
            currentServer = serverName;
            const btn1 = document.getElementById('serverBtn1');
            const btn2 = document.getElementById('serverBtn2');

            if (serverName === 'vidhide') {
                btn1.className = "bg-[#ff5500] text-white px-3 py-1 rounded-lg text-xs font-bold transition shadow";
                btn2.className = "bg-[#1a1a2b] hover:bg-gray-800 text-gray-300 border border-gray-700 px-3 py-1 rounded-lg text-xs font-semibold transition";
            } else {
                btn2.className = "bg-[#ff5500] text-white px-3 py-1 rounded-lg text-xs font-bold transition shadow";
                btn1.className = "bg-[#1a1a2b] hover:bg-gray-800 text-gray-300 border border-gray-700 px-3 py-1 rounded-lg text-xs font-semibold transition";
            }
            loadEpisode();
        }

        // Initial Load on page startup
        window.onload = function() {
            loadEpisode();
        };
    </script>
</body>
</html>
