<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solo Leveling - 7ANIME</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-[#0f0f1a] text-white min-h-screen">

    <!-- Header -->
    <header class="p-4 bg-[#1a1a2b] border-b border-gray-800 flex justify-between items-center">
        <h1 class="text-xl font-bold text-[#ff5500]">7ANIME</h1>
        <a href="download.html?page=solo_leveling_videoplayer.html" class="bg-[#ff5500] hover:bg-[#e04c00] text-white px-4 py-2 rounded-xl text-sm font-bold transition flex items-center space-x-2">
            <i class="fa-solid fa-download"></i>
            <span>Download Page</span>
        </a>
    </header>

    <!-- Main Content -->
    <main class="max-w-6xl mx-auto p-4 md:p-6 space-y-6">
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <!-- Poster & Info -->
            <div class="bg-[#1a1a2b] p-4 rounded-2xl border border-gray-800 flex flex-col items-center text-center">
                <img src="https://via.placeholder.com/300x420" alt="Solo Leveling Poster" class="w-48 h-64 object-cover rounded-xl shadow-lg mb-4">
                <h1 class="text-xl font-bold mb-2">Solo Leveling</h1>
                <p class="text-xs text-gray-300 leading-relaxed">Watch and download official episodes in Hindi audio direct links.</p>
            </div>

            <!-- Video Player Container -->
            <div class="md:col-span-2 space-y-4">
                <div class="aspect-video w-full bg-black rounded-2xl overflow-hidden border border-gray-800 relative">
                    <iframe id="animeVideoPlayer" src="https://vidhidepro.com/embed/EXAMPLE1" class="w-full h-full border-0" allowfullscreen></iframe>
                </div>

                <!-- Video Controls & Direct Download Button -->
                <div class="flex items-center justify-between bg-[#1a1a2b] p-4 rounded-xl border border-gray-800">
                    <div>
                        <h2 class="text-sm font-bold">Now Playing</h2>
                        <p class="text-xs text-gray-400">Select episode from below</p>
                    </div>
                    <button onclick="downloadCurrentVideo()" class="bg-[#ff5500] hover:bg-[#e04c00] text-white px-4 py-2 rounded-xl text-sm font-bold transition flex items-center space-x-2 cursor-pointer">
                        <i class="fa-solid fa-download"></i>
                        <span>Download Video</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- Episodes List -->
        <div class="bg-[#1a1a2b] p-6 rounded-2xl border border-gray-800">
            <h3 class="text-lg font-bold mb-4 flex items-center space-x-2">
                <i class="fa-solid fa-list text-[#ff5500]"></i>
                <span>Episodes</span>
            </h3>
            <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-3">
                <button class="ep-btn bg-[#ff5500] text-white p-3 rounded-xl font-bold text-xs hover:bg-[#e04c00] transition text-center" 
                        data-ep="1" 
                        data-vidhide="https://vidhidepro.com/embed/EXAMPLE1" 
                        onclick="changeEpisode(this, 'https://vidhidepro.com/embed/EXAMPLE1')">
                    Episode 1
                </button>
                <button class="ep-btn bg-[#1a1a2b] border border-gray-700 text-gray-300 p-3 rounded-xl font-bold text-xs hover:border-[#ff5500] transition text-center" 
                        data-ep="2" 
                        data-vidhide="https://vidhidepro.com/embed/EXAMPLE2" 
                        onclick="changeEpisode(this, 'https://vidhidepro.com/embed/EXAMPLE2')">
                    Episode 2
                </button>
                <button class="ep-btn bg-[#1a1a2b] border border-gray-700 text-gray-300 p-3 rounded-xl font-bold text-xs hover:border-[#ff5500] transition text-center" 
                        data-ep="3" 
                        data-vidhide="https://vidhidepro.com/embed/EXAMPLE3" 
                        onclick="changeEpisode(this, 'https://vidhidepro.com/embed/EXAMPLE3')">
                    Episode 3
                </button>
                <button class="ep-btn bg-[#1a1a2b] border border-gray-700 text-gray-300 p-3 rounded-xl font-bold text-xs hover:border-[#ff5500] transition text-center" 
                        data-ep="4" 
                        data-vidhide="https://vidhidepro.com/embed/EXAMPLE4" 
                        onclick="changeEpisode(this, 'https://vidhidepro.com/embed/EXAMPLE4')">
                    Episode 4
                </button>
            </div>
        </div>
    </main>

    <script>
        // Render Backend URL Paste Karein
        const BACKEND_URL = "https://YOUR-RENDER-APP-NAME.onrender.com";

        let activeEmbedLink = "https://vidhidepro.com/embed/EXAMPLE1";

        function extractVidhideCode(url) {
            if (!url) return null;
            const match = url.match(/\/(?:embed|d)\/([a-zA-Z0-9]+)/);
            return match ? match[1] : null;
        }

        function changeEpisode(btn, embedUrl) {
            activeEmbedLink = embedUrl;
            const iframe = document.getElementById('animeVideoPlayer');
            iframe.src = embedUrl;

            document.querySelectorAll('.ep-btn').forEach(b => {
                b.classList.remove('bg-[#ff5500]', 'text-white');
                b.classList.add('bg-[#1a1a2b]', 'text-gray-300');
            });
            btn.classList.remove('bg-[#1a1a2b]', 'text-gray-300');
            btn.classList.add('bg-[#ff5500]', 'text-white');
        }

        async function downloadCurrentVideo() {
            const iframe = document.getElementById('animeVideoPlayer');
            const currentSrc = iframe.src || activeEmbedLink;

            if (!currentSrc || currentSrc === "about:blank") {
                alert("Pehle koi episode select karein!");
                return;
            }

            const fileCode = extractVidhideCode(currentSrc);

            if (!fileCode) {
                alert("Valid video link nahi mil paaya!");
                return;
            }

            alert("Direct Download Link process ho raha hai, please wait...");

            try {
                const response = await fetch(`${BACKEND_URL}/get-download-link?code=${fileCode}`);
                const data = await response.json();

                if (data.success && data.download_url) {
                    const link = document.createElement('a');
                    link.href = data.download_url;
                    link.setAttribute('download', '');
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                } else {
                    alert("Direct link nahi mila, normal download page khol rahe hain.");
                    window.open(`https://vidhidepro.com/d/${fileCode}`, '_blank');
                }
            } catch (error) {
                console.error("Download Error:", error);
                alert("Backend response nahi de raha hai. Normal download page khol rahe hain.");
                window.open(`https://vidhidepro.com/d/${fileCode}`, '_blank');
            }
        }
    </script>
</body>
</html>
