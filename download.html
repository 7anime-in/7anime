<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Download Anime - 7ANIME</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-[#0f0f1a] text-white min-h-screen">

    <!-- Header -->
    <header class="p-4 bg-[#1a1a2b] border-b border-gray-800 flex justify-between items-center">
        <h1 class="text-xl font-bold text-[#ff5500]">7ANIME</h1>
        <a id="backToPlayerBtn" href="solo_leveling_videoplayer.html" class="bg-gray-800 hover:bg-gray-700 text-white px-4 py-2 rounded-xl text-sm font-bold transition flex items-center space-x-2">
            <i class="fa-solid fa-arrow-left"></i>
            <span>Back to Player</span>
        </a>
    </header>

    <main class="max-w-4xl mx-auto p-4 md:p-6 space-y-6">
        <!-- Details Card -->
        <div class="bg-[#1a1a2b] border border-gray-800 p-6 rounded-2xl flex flex-col md:flex-row items-center gap-6">
            <img id="animePoster" src="" alt="Poster" class="w-32 h-44 object-cover rounded-xl bg-gray-800">
            <div class="text-center md:text-left space-y-2">
                <h1 id="animeTitle" class="text-2xl font-extrabold text-white">Loading Anime...</h1>
                <p id="animeDesc" class="text-xs text-gray-300 max-w-xl"></p>
                <span id="epCountText" class="inline-block bg-[#ff5500]/20 text-[#ff5500] text-xs font-bold px-3 py-1 rounded-full border border-[#ff5500]/30">
                    0 Episodes
                </span>
            </div>
        </div>

        <!-- Batch Packs Section -->
        <div class="space-y-3">
            <h2 class="text-sm font-bold text-gray-400 uppercase tracking-wider">Batch Download Packs</h2>
            <div id="batchPacksContainer" class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <!-- Packs dynamic HTML render honge -->
            </div>
        </div>

        <!-- Individual Episodes Section -->
        <div class="space-y-3">
            <h2 class="text-sm font-bold text-gray-400 uppercase tracking-wider">All Episodes Direct Download</h2>
            <div id="episodeListContainer" class="space-y-3">
                <!-- Episodes dynamic HTML render honge -->
            </div>
        </div>
    </main>

    <script>
        // Render Backend URL Paste Karein
        const BACKEND_URL = "https://YOUR-RENDER-APP-NAME.onrender.com"; 

        let extractedEpisodes = [];

        function extractVidhideCode(url) {
            if (!url) return null;
            const match = url.match(/\/(?:embed|d)\/([a-zA-Z0-9]+)/);
            return match ? match[1] : null;
        }

        async function downloadViaBackend(fileCode) {
            if (!fileCode) {
                alert("Invalid File Code!");
                return;
            }

            alert("Direct Download Link Process Ho Raha Hai, Hold Karo...");

            try {
                const response = await fetch(`${BACKEND_URL}/get-download-link?code=${fileCode}`);
                const data = await response.json();

                if (data.success && data.download_url) {
                    const link = document.createElement('a');
                    link.href = data.download_url;
                    link.setAttribute('download', '');
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                } else {
                    alert("Direct link nahi mil paaya! Normal download page khol rahe hain.");
                    window.open(`https://vidhidepro.com/d/${fileCode}`, '_blank');
                }
            } catch (error) {
                console.error("Backend Error:", error);
                alert("Server response nahi de raha hai. Normal download page open kar rahe hain.");
                window.open(`https://vidhidepro.com/d/${fileCode}`, '_blank');
            }
        }

        function downloadPack(startEp, endEp) {
            const selected = extractedEpisodes.filter(e => e.ep >= startEp && e.ep <= endEp);
            
            if(confirm(`Download Episodes ${startEp} to ${endEp}? (${selected.length} files download hongi)`)) {
                selected.forEach((item, index) => {
                    setTimeout(() => {
                        if (item.code) {
                            downloadViaBackend(item.code);
                        }
                    }, index * 1500);
                });
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const playerPage = urlParams.get('page') || 'solo_leveling_videoplayer.html';

            document.getElementById('backToPlayerBtn').href = playerPage;

            fetch(playerPage)
                .then(res => {
                    if(!res.ok) throw new Error('Player page not found');
                    return res.text();
                })
                .then(htmlText => {
                    const parser = new DOMParser();
                    const doc = parser.parseFromString(htmlText, 'text/html');

                    const title = doc.querySelector('h1')?.innerText || 'Anime Download';
                    const poster = doc.querySelector('img')?.src || '';
                    const desc = doc.querySelector('p.text-gray-300')?.innerText || 'Watch and download official episodes.';

                    document.title = `Download ${title} - 7ANIME`;
                    document.getElementById('animeTitle').innerText = title;
                    document.getElementById('animePoster').src = poster;
                    document.getElementById('animeDesc').innerText = desc;

                    const epButtons = doc.querySelectorAll('.ep-btn');
                    extractedEpisodes = [];

                    epButtons.forEach(btn => {
                        const epNum = parseInt(btn.getAttribute('data-ep'));
                        const embedUrl = btn.getAttribute('data-vidhide');
                        const fileCode = extractVidhideCode(embedUrl);

                        if (embedUrl && fileCode) {
                            extractedEpisodes.push({
                                ep: epNum,
                                code: fileCode,
                                downloadUrl: `https://vidhidepro.com/d/${fileCode}`
                            });
                        }
                    });

                    // Render Batch Packs
                    const packContainer = document.getElementById('batchPacksContainer');
                    const totalEps = extractedEpisodes.length;
                    const chunkSize = 4;
                    let packsHTML = '';

                    for (let i = 0; i < totalEps; i += chunkSize) {
                        const start = i + 1;
                        const end = Math.min(i + chunkSize, totalEps);
                        const packNum = Math.floor(i / chunkSize) + 1;

                        packsHTML += `
                            <div class="bg-[#1a1a2b] border border-gray-700 p-4 rounded-xl flex items-center justify-between">
                                <div>
                                    <p class="text-xs text-[#ff5500] font-bold">PACK PART ${packNum}</p>
                                    <p class="text-sm font-extrabold text-white">Episodes ${start} - ${end}</p>
                                </div>
                                <button onclick="downloadPack(${start}, ${end})" class="bg-[#ff5500] hover:bg-[#e04c00] text-white px-3 py-1.5 rounded-lg text-xs font-bold transition flex items-center space-x-1 cursor-pointer">
                                    <i class="fa-solid fa-download text-[10px]"></i>
                                    <span>Get Pack</span>
                                </button>
                            </div>
                        `;
                    }
                    packContainer.innerHTML = packsHTML || '<p class="text-xs text-gray-500">No packs available.</p>';

                    // Render Episode List
                    const epContainer = document.getElementById('episodeListContainer');
                    document.getElementById('epCountText').innerText = `${totalEps} Episodes`;

                    let epHTML = '';
                    extractedEpisodes.forEach(item => {
                        epHTML += `
                            <div class="bg-[#1a1a2b] border border-gray-800 rounded-xl p-3 flex flex-col sm:flex-row sm:items-center justify-between gap-3 hover:border-gray-700 transition">
                                <div class="flex items-center space-x-3">
                                    <span class="bg-[#ff5500]/20 text-[#ff5500] font-extrabold text-xs px-2.5 py-1 rounded-lg border border-[#ff5500]/30">
                                        EP ${item.ep}
                                    </span>
                                    <div>
                                        <h3 class="text-xs md:text-sm font-bold text-white">Episode ${item.ep}</h3>
                                        <p class="text-[11px] text-gray-400">Hindi Audio Direct File</p>
                                    </div>
                                </div>
                                <div class="flex items-center space-x-2 self-end sm:self-center">
                                    <button onclick="downloadViaBackend('${item.code}')" class="bg-[#ff5500] hover:bg-[#e04c00] text-white px-3 py-1.5 rounded-lg text-xs font-bold transition flex items-center space-x-1.5 cursor-pointer">
                                        <i class="fa-solid fa-download text-[10px]"></i>
                                        <span>Fast Direct Download</span>
                                    </button>
                                </div>
                            </div>
                        `;
                    });
                    epContainer.innerHTML = epHTML || '<p class="text-xs text-gray-500">No episodes found.</p>';
                })
                .catch(err => {
                    console.error(err);
                    document.getElementById('animeTitle').innerText = "Error loading anime data";
                });
        });
    </script>
</body>
</html>
