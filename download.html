<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>7anime - Download Center</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #0b0c10;
            color: #c5c6c7;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- ==================== NAVBAR ==================== -->
    <nav class="sticky top-0 z-50 bg-[#1f2833]/90 backdrop-blur-md border-b border-gray-800 px-4 py-3 shadow-lg">
        <div class="max-w-7xl mx-auto flex items-center justify-between">
            <a href="index.html" class="flex items-center gap-2 text-2xl font-extrabold text-[#66fcf1]">
                <i class="fa-solid fa-play-circle text-3xl"></i>
                <span>7<span class="text-white">anime</span></span>
            </a>
            <div class="flex items-center gap-4 text-sm">
                <a id="navWatchLink" href="#" class="text-gray-300 hover:text-[#66fcf1] transition flex items-center gap-1">
                    <i class="fa-solid fa-play text-xs"></i> Watch Online
                </a>
                <a href="index.html" class="text-gray-300 hover:text-[#66fcf1] transition flex items-center gap-1">
                    <i class="fa-solid fa-house text-xs"></i> Home
                </a>
            </div>
        </div>
    </nav>

    <!-- ==================== MAIN CONTENT ==================== -->
    <main class="max-w-6xl mx-auto px-4 py-6 flex-1 w-full flex flex-col gap-6">

        <!-- ==================== ANIME BANNER & HEADER INFO ==================== -->
        <div class="bg-[#1f2833] p-5 md:p-8 rounded-2xl border border-gray-800 flex flex-col md:flex-row items-center md:items-start gap-6 shadow-xl">
            <!-- ANIME POSTER IMAGE -->
            <img 
                id="animePoster" 
                src="https://via.placeholder.com/300x420/0b0c10/66fcf1?text=Loading..." 
                alt="Anime Poster" 
                class="w-36 md:w-48 aspect-[3/4] object-cover rounded-xl border border-gray-700 shadow-md bg-gray-900"
            >
            <div class="flex-1 text-center md:text-left flex flex-col justify-between h-full py-1">
                <div>
                    <div class="flex items-center justify-center md:justify-start gap-2 mb-2">
                        <span id="serverBadge" class="bg-[#66fcf1]/20 text-[#66fcf1] text-xs font-bold px-3 py-1 rounded-full border border-[#66fcf1]/30">High Speed Server</span>
                        <span id="totalEpBadge" class="bg-gray-800 text-gray-300 text-xs font-bold px-3 py-1 rounded-full border border-gray-700">Loading...</span>
                    </div>
                    <h1 id="animeTitle" class="text-2xl md:text-4xl font-black text-white">Loading Anime...</h1>
                    <p id="headerSubText" class="text-sm text-gray-400 mt-2">Select individual episodes below or download securely.</p>
                </div>

                <div class="flex flex-wrap items-center justify-center md:justify-start gap-3 mt-6">
                    <a id="watchNowBtn" href="#" class="bg-[#66fcf1] hover:bg-[#45a29e] text-black font-extrabold px-6 py-2.5 rounded-lg flex items-center gap-2 transition text-sm shadow-md">
                        <i class="fa-solid fa-play"></i> Switch To Player
                    </a>
                </div>
            </div>
        </div>

        <!-- ==================== DOWNLOAD SECTION ==================== -->
        <div class="bg-[#1f2833] p-4 md:p-6 rounded-2xl border border-gray-800 flex flex-col gap-5">
            
            <!-- Season Selector Header -->
            <div id="seasonHeaderBox" class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 border-b border-gray-700/60 pb-4">
                <h2 class="text-xl font-bold text-white flex items-center gap-2">
                    <i class="fa-solid fa-cloud-arrow-down text-[#66fcf1]"></i> Available Downloads (<span id="activeSeasonLabel" class="text-[#66fcf1]">Season 1</span>)
                </h2>
                
                <!-- Season Buttons -->
                <div id="seasonTabsContainer" class="flex items-center gap-2 overflow-x-auto pb-1 sm:pb-0">
                    <!-- Dynamic Season Buttons -->
                </div>
            </div>

            <!-- Download List Container -->
            <div id="episodesDownloadList" class="flex flex-col gap-2 max-h-[600px] overflow-y-auto pr-1">
                <div class="animate-pulse bg-gray-800 h-14 rounded-lg"></div>
                <div class="animate-pulse bg-gray-800 h-14 rounded-lg"></div>
                <div class="animate-pulse bg-gray-800 h-14 rounded-lg"></div>
            </div>

        </div>

    </main>

    <!-- ==================== FOOTER ==================== -->
    <footer class="bg-[#1f2833] border-t border-gray-800 text-center py-6 text-sm text-gray-400 mt-auto">
        <p>© 2026 7anime Engine. Powered by Hugging Face Downloader Backend.</p>
    </footer>

    <!-- ==================== JS LOGIC ==================== -->
    <script>
        let animeData = null;
        let currentSeason = "Season 1";

        // Updated to Hugging Face Space backend URL for direct downloads[span_2](start_span)[span_2](end_span)
        const RENDER_BACKEND_URL = "https://bfbfh-embed-link.hf.space";

        const urlParams = new URLSearchParams(window.location.search);
        const animeSlug = urlParams.get('anime') || 'solo_leveling';
        const requestedSeason = urlParams.get('season') || 'Season 1';
        const requestedQuality = (urlParams.get('quality') || '720p').toLowerCase();
        const typeParam = urlParams.get('type') || 'video';
        const titleParam = urlParams.get('title') || '';
        const dbFile = urlParams.get('db');
        const cardFileParam = urlParams.get('card_file');
        const indexFileParam = urlParams.get('index') || 'anime_index.json';

        function formatImageUrl(url) {
            if (!url) return "https://via.placeholder.com/300x420?text=7anime";
            const driveMatch = url.match(/\/d\/([a-zA-Z0-9_-]+)/) || url.match(/id=([a-zA-Z0-9_-]+)/);
            if (driveMatch && driveMatch[1]) {
                return `https://lh3.googleusercontent.com/d/${driveMatch[1]}`;
            }
            return url;
        }

        function processDownloadUrl(rawUrl) {
            if (!rawUrl) return "#";
            if (rawUrl.includes("hf.space") || rawUrl.includes("onrender.com")) {
                let pathOnly = rawUrl.replace(/^https?:\/\/[^\/]+/, "");
                return `${RENDER_BACKEND_URL}${pathOnly}`;
            }
            if (rawUrl.startsWith("http://") || rawUrl.startsWith("https://")) {
                if (rawUrl.includes("t.me/")) {
                    let parts = rawUrl.split("t.me/");
                    if (parts.length > 1) {
                        let subParts = parts[1].split("/");
                        if (subParts.length >= 2) {
                            let chatId = subParts[0];
                            let msgId = subParts[1].split("?")[0];
                            return `${RENDER_BACKEND_URL}/download/${chatId}/${msgId}`;
                        }
                    }
                }
                return rawUrl;
            }
            if (rawUrl.includes("/")) {
                let [chatId, msgId] = rawUrl.split("/");
                return `${RENDER_BACKEND_URL}/download/${chatId}/${msgId}`;
            } else if (!isNaN(rawUrl)) {
                return `${RENDER_BACKEND_URL}/download/@7anime_backup/${rawUrl}`;
            }
            return rawUrl;
        }

        async function initDownloader() {
            try {
                let foundCardItem = null;
                let downloads = null;

                const cacheKey = `cache_7anime_${animeSlug}_${requestedQuality}_${typeParam}`;
                const cachedRaw = localStorage.getItem(cacheKey);

                if (cachedRaw) {
                    const cachedData = JSON.parse(cachedRaw);
                    if (cachedData && (Date.now() - cachedData.timestamp < 600000)) {
                        foundCardItem = cachedData.card;
                        downloads = cachedData.downloads;
                    }
                }

                if (!downloads) {
                    let targetDbFile = dbFile || `anime_1_${requestedQuality}.json`;
                    let cardFileToFetch = cardFileParam;

                    if (!cardFileToFetch) {
                        try {
                            const res = await fetch(`./${indexFileParam}?v=${Date.now()}`);
                            if (res.ok) {
                                const json = await res.json();
                                if (json[animeSlug]) {
                                    if (json[animeSlug].card_file) cardFileToFetch = json[animeSlug].card_file;
                                    if (!dbFile && json[animeSlug].video_files) {
                                        let vInfo = json[animeSlug].video_files[requestedQuality] || json[animeSlug].video_files[Object.keys(json[animeSlug].video_files)[0]];
                                        targetDbFile = typeof vInfo === 'string' ? vInfo : (vInfo ? vInfo.file : targetDbFile);
                                    }
                                }
                            }
                        } catch (e) {}
                    }

                    let pList = [];
                    if (cardFileToFetch) pList.push(fetch(`./${cardFileToFetch}?v=${Date.now()}`).then(r => r.ok ? r.json() : null).catch(() => null));
                    else pList.push(Promise.resolve(null));

                    pList.push(fetch(`./${targetDbFile}?v=${Date.now()}`).then(r => r.ok ? r.json() : null).catch(() => null));

                    const [cardRes, dbRes] = await Promise.all(pList);

                    if (cardRes) {
                        foundCardItem = cardRes.cards?.[animeSlug] || cardRes?.[animeSlug] || null;
                    }
                    if (dbRes) {
                        downloads = dbRes.cards?.[animeSlug]?.downloads || dbRes.cards?.[animeSlug] || dbRes?.[animeSlug]?.downloads || {};
                    }
                }

                animeData = {
                    title: foundCardItem?.title || animeSlug.replace(/_/g, ' ').toUpperCase(),
                    poster: foundCardItem?.poster || foundCardItem?.image || "",
                    downloads: downloads || {}
                };

                document.getElementById("animeTitle").innerText = animeData.title;
                document.getElementById("watchNowBtn").href = `anime.html?anime=${animeSlug}`;
                document.getElementById("navWatchLink").href = `anime.html?anime=${animeSlug}`;

                let posterUrl = formatImageUrl(animeData.poster);
                document.getElementById("animePoster").src = posterUrl || `https://via.placeholder.com/300x420/1f2833/66fcf1?text=${encodeURIComponent(animeData.title)}`;

                if (typeParam === 'zip' || (Object.keys(animeData.downloads).length <= 2 && titleParam)) {
                    renderSingleFileLayout();
                } else {
                    renderSeriesLayout();
                }

            } catch(err) {
                console.error("Error loading downloader data:", err);
                document.getElementById("animeTitle").innerText = "Anime Not Found";
                document.getElementById("episodesDownloadList").innerHTML = `<p class="text-center py-8 text-gray-500">Failed to load download database.</p>`;
            }
        }

        function renderSingleFileLayout() {
            document.getElementById("seasonHeaderBox").style.display = "none";
            document.getElementById("serverBadge").innerText = "ZIP / Batch Archive Server";
            document.getElementById("totalEpBadge").innerText = "Direct Fast Download";
            document.getElementById("headerSubText").innerText = "Click the button below to start your high-speed archive download.";

            const listContainer = document.getElementById("episodesDownloadList");
            const downloads = animeData.downloads;
            
            let targetKey = titleParam || Object.keys(downloads)[0];
            let rawLink = targetKey ? downloads[targetKey] : Object.values(downloads)[0];
            let finalUrl = processDownloadUrl(rawLink);

            listContainer.innerHTML = `
                <div class="bg-gradient-to-r from-gray-900 to-[#1f2833] border border-amber-500/40 p-6 rounded-2xl flex flex-col md:flex-row items-center justify-between gap-6 shadow-2xl">
                    <div class="flex items-center gap-4 text-center md:text-left">
                        <div class="w-16 h-16 rounded-2xl bg-amber-500/10 border border-amber-500/30 flex items-center justify-center text-amber-400 text-3xl flex-shrink-0">
                            <i class="fa-solid fa-file-zipper"></i>
                        </div>
                        <div>
                            <span class="text-[10px] bg-amber-500/20 text-amber-300 font-bold px-2.5 py-0.5 rounded-full uppercase tracking-wider border border-amber-500/30">Batch Archive</span>
                            <h3 class="font-black text-white text-lg md:text-xl mt-1">${targetKey || animeData.title}</h3>
                            <p class="text-xs text-gray-400 mt-0.5">High-Speed Secure Server • Dual Audio / Sub</p>
                        </div>
                    </div>

                    <a 
                        href="${finalUrl}" 
                        target="_blank" 
                        class="w-full md:w-auto bg-amber-500 hover:bg-amber-400 text-black font-black text-sm px-8 py-3.5 rounded-xl transition shadow-lg flex items-center justify-center gap-2"
                    >
                        <i class="fa-solid fa-cloud-arrow-down text-base"></i> Download Zip File
                    </a>
                </div>
            `;
        }

        function renderSeriesLayout() {
            let seasonsMap = {};
            let downloads = animeData.downloads;

            let normalizedReqSeason = requestedSeason.toLowerCase().replace(/\s+/g, '');

            Object.keys(downloads).forEach(dlKey => {
                let sMatch = dlKey.match(/Season\s*(\d+)/i) || dlKey.match(/S(\d+)/i);
                let seasonName = sMatch ? `Season ${sMatch[1]}` : "Season 1";
                let normSeasonName = seasonName.toLowerCase().replace(/\s+/g, '');

                if (normSeasonName !== normalizedReqSeason) return;
                
                let epMatch = dlKey.match(/Ep\s*(\d+)/i) || dlKey.match(/Episode\s*(\d+)/i) || dlKey.match(/-\s*(\d+)$/);
                let epNum = epMatch ? parseInt(epMatch[1]) : 1;

                let qMatch = dlKey.match(/(480p|720p|1080p|4k)/i);
                let epQuality = qMatch ? qMatch[1].toLowerCase() : requestedQuality;

                if (!seasonsMap[seasonName]) seasonsMap[seasonName] = [];

                if (!seasonsMap[seasonName].some(e => e.ep === epNum && e.quality === epQuality)) {
                    seasonsMap[seasonName].push({
                        ep: epNum,
                        quality: epQuality,
                        download_url: processDownloadUrl(downloads[dlKey]),
                        type: "official"
                    });
                }
            });

            Object.keys(seasonsMap).forEach(s => {
                seasonsMap[s].sort((a, b) => a.ep - b.ep);
            });

            animeData.seasons = seasonsMap;
            renderSeasonTabs();

            const seasons = Object.keys(animeData.seasons);
            if (seasons.length > 0) {
                currentSeason = seasons[0];
                document.getElementById("activeSeasonLabel").innerText = currentSeason;
                renderEpisodeDownloadList(currentSeason);
            } else {
                document.getElementById("episodesDownloadList").innerHTML = `<p class="text-center py-8 text-gray-500">No episodes found for ${requestedSeason} (${requestedQuality.toUpperCase()}).</p>`;
                document.getElementById("totalEpBadge").innerText = `0 Episodes`;
            }
        }

        function renderSeasonTabs() {
            const tabsContainer = document.getElementById("seasonTabsContainer");
            const seasons = Object.keys(animeData?.seasons || {});

            tabsContainer.innerHTML = seasons.map(s => `
                <button 
                    onclick="switchSeason('${s}')" 
                    id="tab-s-${s.replace(/\s+/g, '-')}"
                    class="px-4 py-1.5 text-xs font-black rounded-lg transition-all duration-200 cursor-pointer flex items-center gap-1.5"
                >
                    <i class="fa-solid fa-layer-group text-[10px]"></i> ${s}
                </button>
            `).join("");

            updateTabStyles();
        }

        function switchSeason(seasonName) {
            currentSeason = seasonName;
            document.getElementById("activeSeasonLabel").innerText = currentSeason;
            updateTabStyles();
            renderEpisodeDownloadList(seasonName);
        }

        function updateTabStyles() {
            const seasons = Object.keys(animeData?.seasons || {});
            seasons.forEach(s => {
                const tab = document.getElementById(`tab-s-${s.replace(/\s+/g, '-')}`);
                if(tab) {
                    if(s === currentSeason) {
                        tab.className = "px-4 py-1.5 text-xs font-black rounded-lg bg-[#66fcf1] text-black border border-[#66fcf1] shadow-lg shadow-[#66fcf1]/20 scale-105 transition-all duration-200 cursor-pointer flex items-center gap-1.5";
                    } else {
                        tab.className = "px-4 py-1.5 text-xs font-bold rounded-lg bg-gray-800 text-gray-300 hover:bg-gray-700 hover:text-white border border-gray-700 transition-all duration-200 cursor-pointer flex items-center gap-1.5";
                    }
                }
            });
        }

        function renderEpisodeDownloadList(seasonName) {
            const listContainer = document.getElementById("episodesDownloadList");
            const episodes = animeData?.seasons?.[seasonName] || [];

            document.getElementById("totalEpBadge").innerText = `${episodes.length} Episodes Total`;

            if(episodes.length === 0) {
                listContainer.innerHTML = `<p class="text-center py-8 text-gray-500">No episodes available in ${seasonName}.</p>`;
                return;
            }

            listContainer.innerHTML = episodes.map(ep => {
                return `
                    <div class="bg-gray-800/60 hover:bg-gray-800 border border-gray-700/70 p-3 md:p-4 rounded-xl flex items-center justify-between gap-4 transition">
                        <div class="flex items-center gap-3">
                            <div class="w-10 h-10 rounded-lg bg-[#0b0c10] border border-gray-700 flex items-center justify-center font-black text-[#66fcf1] text-sm">
                                ${ep.ep}
                            </div>
                            <div>
                                <h3 class="font-bold text-white text-sm md:text-base">Episode ${ep.ep} (${ep.quality.toUpperCase()})</h3>
                                <div class="flex items-center gap-2 mt-0.5">
                                    <span class="text-[10px] bg-gray-900 text-gray-400 px-2 py-0.5 rounded border border-gray-800 uppercase font-semibold">
                                        Official Dub
                                    </span>
                                    <span class="text-[10px] text-gray-400">MP4 / ${ep.quality.toUpperCase()}</span>
                                </div>
                            </div>
                        </div>

                        <div class="flex items-center gap-2">
                            <a 
                                href="anime.html?anime=${animeSlug}" 
                                class="hidden sm:flex bg-gray-900 hover:bg-gray-700 text-gray-300 text-xs px-3 py-2 rounded-lg transition border border-gray-700 items-center gap-1"
                                title="Stream Online"
                            >
                                <i class="fa-solid fa-play"></i> Watch
                            </a>
                            <a 
                                href="${ep.download_url}" 
                                target="_blank" 
                                class="bg-[#66fcf1] hover:bg-[#45a29e] text-black font-extrabold text-xs px-4 py-2 rounded-lg flex items-center gap-1.5 transition shadow"
                            >
                                <i class="fa-solid fa-download"></i>
                                <span>Download</span>
                            </a>
                        </div>
                    </div>
                `;
            }).join("");
        }

        window.addEventListener("DOMContentLoaded", initDownloader);
    </script>
</body>
</html>
