<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>7Anime - Search Results</title>
    <style>
        body { background: #0b0c1b; color: white; font-family: sans-serif; padding: 50px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 20px; margin-top: 20px;}
        .card { background: #15182d; border-radius: 8px; padding: 10px; cursor: pointer; text-align: center; }
        .card img { width: 100%; height: 200px; object-fit: cover; border-radius: 6px; }
    </style>
</head>
<body>

    <h2>Search Results for: <span id="searchTerm" style="color:#8b5cf6;"></span></h2>
    <div class="grid" id="resultsGrid"></div>

    <script>
        const animeDatabase = [
            { name: "Solo Leveling", key: "solo_leveling", img: "https://m.media-amazon.com/images/M/MV5BODlhMTY5N2UtNzA1Yi00ODliLTg2OTUtN2ExZDdiNmNmZDZhXkEyXkFqcGc@._V1_.jpg" },
            { name: "One Piece", key: "one_piece", img: "https://m.media-amazon.com/images/M/MV5BMTNjNGU4NTUtYmVjMy00ZjIyLTgxN2MtVTlkNWVlN2JhMSSXkEyXkFqcGc@._V1_.jpg" },
            { name: "Jujutsu Kaisen", key: "jujutsu_kaisen", img: "https://m.media-amazon.com/images/M/MV5BNGY4MTg3NjgtMmFkIN00NTg5LWE3MWItMjc5YTBhNDg3ZDFlXkEyXkFqcGc@._V1_.jpg" },
            { name: "Demon Slayer", key: "demon_slayer", img: "https://m.media-amazon.com/images/M/MV5BYzA2Nzk5M2EtMjEwNi00OWE4LWIxOWEtOGI2NTNmZmU0N2VhXkEyXkFqcGc@._V1_.jpg" }
        ];

        // URL parsing logic
        const urlParams = new URLSearchParams(window.location.search);
        const query = urlParams.get('q') || '';
        document.getElementById('searchTerm').innerText = query;

        const resultsGrid = document.getElementById('resultsGrid');
        const filtered = animeDatabase.filter(a => a.name.toLowerCase().includes(query.toLowerCase()));

        if(filtered.length === 0){
            resultsGrid.innerHTML = "<p>No anime found.</p>";
        } else {
            filtered.forEach(anime => {
                resultsGrid.innerHTML += `
                    <div class="card" onclick="location.href='${anime.key}_videoplayer.html'">
                        <img src="${anime.img}" />
                        <h3>${anime.name}</h3>
                    </div>
                `;
            });
        }
    </script>
</body>
</html>
