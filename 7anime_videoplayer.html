<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>7anime - Streaming Player</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #0b0c10;
            color: #c5c6c7;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .ep-btn-active {
            background-color: #66fcf1 !important;
            color: #000000 !important;
            font-weight: bold;
            border-color: #66fcf1 !important;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- ==================== NAVBAR ==================== -->
    <nav class="sticky top-0 z-50 bg-[#1f2833]/90 backdrop-blur-md border-b border-gray-800 px-4 py-3 shadow-lg">
        <div class="max-w-7xl mx-auto flex items-center justify-between">
            <a href="index.html" class="flex items-center gap-2 text-2xl font-extrabold text-[#66fcf1]">
                <i class="fa-solid fa-play-circle text-3xl"></i>
                <span>7<span class="text-white">anime</span></span>
            </a>
            <a href="index.html" class="text-sm text-gray-300 hover:text-[#66fcf1] transition flex items-center gap-1">
                <i class="fa-solid fa-arrow-left"></i> Home Page
            </a>
        </div>
    </nav>

    <!-- ==================== MAIN CONTENT ==================== -->
    <main class="max-w-6xl mx-auto px-4 py-6 flex-1 w-full flex flex-col gap-6">

        <!-- ==================== VIDEO PLAYER CONTAINER ==================== -->
        <div class="bg-black rounded-2xl overflow-hidden shadow-2xl border border-gray-800 aspect-video relative flex items-center justify-center">
            <video 
                id="videoPlayer" 
                controls 
                autoplay 
                preload="metadata"
                poster="https://via.placeholder.com/1280x720/0b0c10/66fcf1?text=7anime+Streaming..." 
                class="w-full h-full object-contain focus:outline-none"
            >
                <source id="videoSource" src="" type="video/mp4">
                Aapka browser HTML5 video tag support nahi karta.
            </video>
            
            <!-- Error Banner Overlay -->
            <div id="playerErrorOverlay" class="hidden absolute inset-0 bg-black/90 flex flex-col items-center justify-center p-6 text-center z-10">
                <i class="fa-solid fa-triangle-exclamation text-amber-400 text-4xl mb-2"></i>
                <h3 class="text-white font-bold text-lg">Video Playback Error</h3>
                <p class="text-xs text-gray-400 max-w-md mt-1">Video stream load hone me dikkat ho rahi hai. Kripya dubaara try karein ya server switch karein.</p>
                <button onclick="retryCurrentEpisode()" class="mt-4 bg-[#66fcf1] text-black font-bold text-xs px-4 py-2 rounded-lg hover:bg-[#45a29e] transition">
                    <i class="fa-solid fa-rotate-right mr-1"></i> Retry Stream
                </button>
            </div>
        </div>

        <!-- ==================== VIDEO DETAILS & CONTROLS ==================== -->
        <div class="bg-[#1f2833] p-4 md:p-6 rounded-xl border border-gray-800 flex flex-col md:flex-row md:items-center justify-between gap-4">
            <div>
                <div class="flex items-center gap-2 mb-1">
                    <span id="dubBadge" class="bg-emerald-500/20 text-emerald-400 text-xs font-bold px-2.5 py-0.5 rounded border border-emerald-500/30 uppercase">Official Dub</span>
                    <span id="seasonBadge" class="bg-gray-800 text-gray-300 text-xs font-bold px-2.5 py-0.5 rounded border border-gray-700">Season 1</span>
                </div>
                <h1 id="animeTitleDisplay" class="text-xl md:text-2xl font-bold text-white">Loading Anime Details...</h1>
                <p id="currentEpTitle" class="text-sm text-gray-400 mt-0.5">Episode 1</p>
            </div>

            <!-- BOT 3 DOWNLOAD & PREV/NEXT BUTTONS -->
            <div class="flex flex-wrap items-center gap-2.5 w-full md:w-auto">
                <!-- Navigation Controls -->
                <button 
                    id="prevEpBtn" 
                    onclick="playNextOrPrev(-1)" 
                    class="bg-gray-800 hover:bg-gray-700 text-white font-semibold px-3 py-2.5 rounded-lg border border-gray-700 text-xs transition flex items-center gap-1 disabled:opacity-40 disabled:cursor-not-allowed"
                >
                    <i class="fa-solid fa-backward-step"></i> Prev
                </button>
                <button 
                    id="nextEpBtn" 
                    onclick="playNextOrPrev(1)" 
                    class="bg-gray-800 hover:bg-gray-700 text-white font-semibold px-3 py-2.5 rounded-lg border border-gray-700 text-xs transition flex items-center gap-1 disabled:opacity-40 disabled:cursor-not-allowed"
                >
                    Next <i class="fa-solid fa-forward-step"></i>
                </button>

                <!-- Direct Single Episode Download (Connected to Bot 3) -->
                <a 
                    id="bot3DownloadBtn" 
                    href="#" 
                    target="_blank" 
                    class="bg-[#66fcf1] hover:bg-[#45a29e] text-black font-extrabold px-5 py-2.5 rounded-lg flex items-center justify-center gap-2 transition shadow-lg text-xs"
                >
                    <i class="fa-solid fa-cloud-arrow-down text-sm"></i>
                    <span>Download</span>
                </a>

                <!-- Multi-Episode / Full Season Download Page -->
                <a 
                    id="fullDownloadPageBtn" 
                    href="#" 
                    class="bg-gray-800 hover:bg-gray-700 text-white font-semibold px-3.5 py-2.5 rounded-lg flex items-center justify-center gap-2 transition border border-gray-700 text-xs"
                    title="All Episodes Download Page"
                >
                    <i class="fa-solid fa-list-check"></i>
                    <span class="hidden sm:inline">Season Pack</span>
                </a>
            </div>
        </div>

        <!-- ==================== SEASON & EPISODE SELECTOR ==================== -->
        <div class="bg-[#1f2833] p-4 md:p-6 rounded-xl border border-gray-800 flex flex-col gap-4">
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 border-b border-gray-700/60 pb-3">
                <h2 class="text-lg font-bold text-white flex items-center gap-2">
                    <i class="fa-solid fa-film text-[#66fcf1]"></i> Episodes List
                </h2>
                
                <!-- Season Tabs -->
                <div id="seasonTabsContainer" class="flex items-center gap-2 overflow-x-auto pb-1 sm:pb-0">
                    <!-- Season buttons dynamically loaded -->
                </div>
            </div>

            <!-- Episode Grid Buttons -->
            <div id="episodesGrid" class="grid grid-cols-3 sm:grid-cols-5 md:grid-cols-8 lg:grid-cols-10 gap-2 md:gap-3 max-h-80 overflow-y-auto p-1">
                <!-- Episode buttons dynamically loaded -->
            </div>
        </div>

    </main>

    <!-- ==================== FOOTER ==================== -->
    <footer class="bg-[#1f2833] border-t border-gray-800 text-center py-6 text-sm text-gray-400 mt-auto">
        <p>© 2026 7anime Engine. Streaming via Bot 2 | Downloads via Bot 3.</p>
    </footer>

    <!-- ==================== JS LOGIC ==================== -->
    <script>
        // Correct Render Web Services Base Endpoints
        const BOT1_API = "https://sevenanime-bot1-scanner.onrender.com";
        const BOT2_STREAM_BASE = "https://sevenanime-bot2-streamer.onrender.com";
        const BOT3_DOWNLOAD_BASE = "https://7anime-bot3-downloader.onrender.com";

        let animeData = null;
        let currentSeason = "1";
        let currentEpNum = 1;
        let activeEpisodeObj = null;

        // URL query parameter parse karein (e.g. ?anime=solo_leveling)
        const urlParams = new URLSearchParams(window.location.search);
        const animeSlug = urlParams.get('anime') || 'solo_leveling';

        const player = document.getElementById("videoPlayer");
        const source = document.getElementById("videoSource");
        const errorOverlay = document.getElementById("playerErrorOverlay");

        // Initialize Player Page
        async function initPlayer() {
            try {
                errorOverlay.classList.add("hidden");
                const res = await fetch(`${BOT1_API}/api/episodes/${animeSlug}`);
                if(!res.ok) throw new Error("Anime API not found");
                
                animeData = await res.json();
                
                document.getElementById("animeTitleDisplay").innerText = animeData.title || animeSlug.replace(/_/g, ' ').toUpperCase();
                document.getElementById("fullDownloadPageBtn").href = `download.html?anime=${animeSlug}`;

                renderSeasonTabs();
                
                // Select first available season & episode
                const seasons = Object.keys(animeData.seasons || {});
                if(seasons.length > 0) {
                    currentSeason = seasons[0];
                    renderEpisodeGrid(currentSeason);
                    
                    const firstEpList = animeData.seasons[currentSeason];
                    if(firstEpList && firstEpList.length > 0) {
                        playEpisodeByNum(firstEpList[0].ep);
                    }
                } else {
                    throw new Error("No seasons data found");
                }
            } catch(err) {
                console.error("Error loading episode data:", err);
                document.getElementById("animeTitleDisplay").innerText = "Video Not Found";
                errorOverlay.classList.remove("hidden");
            }
        }

        // Render Season Switcher Tabs
        function renderSeasonTabs() {
            const tabsContainer = document.getElementById("seasonTabsContainer");
            const seasons = Object.keys(animeData.seasons || {});

            if(seasons.length <= 1) {
                tabsContainer.innerHTML = `<span class="text-xs text-gray-400 font-semibold">Season 1</span>`;
                return;
            }

            tabsContainer.innerHTML = seasons.map(s => `
                <button 
                    onclick="switchSeason('${s}')" 
                    id="tab-s-${s}"
                    class="px-3 py-1 text-xs font-bold rounded-md bg-gray-800 text-gray-300 hover:bg-gray-700 border border-gray-700 transition whitespace-nowrap"
                >
                    Season ${s}
                </button>
            `).join("");

            updateTabStyles();
        }

        // Switch Active Season
        function switchSeason(seasonNum) {
            currentSeason = seasonNum;
            updateTabStyles();
            renderEpisodeGrid(seasonNum);
            
            const epList = animeData.seasons[seasonNum];
            if(epList && epList.length > 0) {
                playEpisodeByNum(epList[0].ep);
            }
        }

        function updateTabStyles() {
            const seasons = Object.keys(animeData.seasons || {});
            seasons.forEach(s => {
                const tab = document.getElementById(`tab-s-${s}`);
                if(tab) {
                    if(s === currentSeason) {
                        tab.className = "px-3 py-1 text-xs font-bold rounded-md bg-[#66fcf1] text-black border border-[#66fcf1] transition whitespace-nowrap";
                    } else {
                        tab.className = "px-3 py-1 text-xs font-bold rounded-md bg-gray-800 text-gray-300 hover:bg-gray-700 border border-gray-700 transition whitespace-nowrap";
                    }
                }
            });
        }

        // Render Episodes Buttons Grid
        function renderEpisodeGrid(seasonNum) {
            const epGrid = document.getElementById("episodesGrid");
            const episodes = animeData.seasons[seasonNum] || [];

            if(episodes.length === 0) {
                epGrid.innerHTML = `<p class="col-span-full text-xs text-gray-500 text-center py-4">No episodes found in this season.</p>`;
                return;
            }

            epGrid.innerHTML = episodes.map(ep => `
                <button 
                    id="ep-btn-${ep.ep}" 
                    onclick="playEpisodeByNum(${ep.ep})"
                    class="ep-card bg-gray-800/80 hover:bg-gray-700 border border-gray-700 text-white text-xs font-bold py-2.5 rounded-lg text-center transition flex flex-col items-center justify-center gap-1"
                >
                    <span>EP ${ep.ep}</span>
                    <span class="text-[9px] text-gray-400 font-normal uppercase">${ep.type || 'Official'}</span>
                </button>
            `).join("");
        }

        // Safe Episode Fetcher
        function playEpisodeByNum(epNum) {
            const epList = animeData.seasons[currentSeason] || [];
            const foundEp = epList.find(e => e.ep == epNum);
            if(foundEp) {
                playEpisode(foundEp);
            }
        }

        // Core Play Episode & Update Links
        function playEpisode(epObj) {
            currentEpNum = epObj.ep;
            activeEpisodeObj = epObj;
            errorOverlay.classList.add("hidden");

            // 1. Construct Bot 2 Video Streaming Link
            let streamUrl = epObj.stream_url;
            if(!streamUrl) {
                streamUrl = `${BOT2_STREAM_BASE}/stream/${epObj.chat_id}/${epObj.msg_id}.mp4`;
            }

            // 2. Construct Bot 3 Direct Download Link
            let downloadUrl = epObj.download_url;
            if(!downloadUrl) {
                downloadUrl = `${BOT3_DOWNLOAD_BASE}/download/${epObj.chat_id}/${epObj.msg_id}`;
            }

            // Update Video Source & Play (Supports direct player assignment & source fallback)
            player.src = streamUrl;
            source.src = streamUrl;
            player.load();
            player.play().catch(e => console.log("Autoplay prevented by browser policy"));

            // Update Download Button
            const downloadBtn = document.getElementById("bot3DownloadBtn");
            downloadBtn.href = downloadUrl;

            // Update Metadata UI
            document.getElementById("currentEpTitle").innerText = `Season ${currentSeason} - Episode ${epObj.ep}`;
            document.getElementById("seasonBadge").innerText = `Season ${currentSeason}`;
            document.getElementById("dubBadge").innerText = epObj.type === "unofficial" ? "Fan Dub" : "Official Dub";

            // Active Button Style Update
            document.querySelectorAll(".ep-card").forEach(btn => btn.classList.remove("ep-btn-active"));
            const activeBtn = document.getElementById(`ep-btn-${epObj.ep}`);
            if(activeBtn) {
                activeBtn.classList.add("ep-btn-active");
            }

            updateNavButtons();
        }

        // Previous / Next Episode Navigation
        function playNextOrPrev(direction) {
            const epList = animeData.seasons[currentSeason] || [];
            const currentIndex = epList.findIndex(e => e.ep == currentEpNum);
            
            if(currentIndex !== -1) {
                const newIndex = currentIndex + direction;
                if(newIndex >= 0 && newIndex < epList.length) {
                    playEpisode(epList[newIndex]);
                }
            }
        }

        function updateNavButtons() {
            const epList = animeData.seasons[currentSeason] || [];
            const currentIndex = epList.findIndex(e => e.ep == currentEpNum);

            document.getElementById("prevEpBtn").disabled = (currentIndex <= 0);
            document.getElementById("nextEpBtn").disabled = (currentIndex >= epList.length - 1);
        }

        function retryCurrentEpisode() {
            if(activeEpisodeObj) {
                playEpisode(activeEpisodeObj);
            } else {
                initPlayer();
            }
        }

        // Auto-Play Next Episode when Video Ends
        player.addEventListener("ended", () => {
            playNextOrPrev(1);
        });

        // Video Error Handler
        player.addEventListener("error", () => {
            errorOverlay.classList.remove("hidden");
        });

        // Start execution on DOM Load
        window.addEventListener("DOMContentLoaded", initPlayer);
    </script>
</body>
</html>
