<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>7anime - Player</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .aspect-video-container {
            position: relative;
            padding-bottom: 56.25%; /* 16:9 Aspect Ratio */
            height: 0;
            overflow: hidden;
        }
        .aspect-video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }
    </style>
</head>
<body class="bg-gray-900 text-white font-sans min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-gray-800 border-b border-gray-700 p-4 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto flex items-center justify-between">
            <a href="/" class="text-2xl font-bold text-red-500 flex items-center gap-2">
                <i class="fa-solid fa-play-circle"></i> 7anime
            </a>
            <a href="/" class="text-sm bg-gray-700 hover:bg-gray-600 px-4 py-2 rounded-lg transition">
                <i class="fa-solid fa-house mr-1"></i> Home
            </a>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto p-4 md:p-6 flex-grow w-full">
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">

            <!-- Player Column -->
            <div class="lg:col-span-2 space-y-4">
                <div class="bg-black rounded-xl overflow-hidden shadow-2xl border border-gray-800 aspect-video-container" id="playerContainer">
                    
                    <!-- Loader -->
                    <div id="loader" class="absolute inset-0 flex flex-col items-center justify-center bg-gray-900 text-gray-400 gap-3 z-10">
                        <i class="fa-solid fa-circle-notch fa-spin text-4xl text-red-500"></i>
                        <p class="text-sm font-medium">Video load ho raha hai, kripya intezar karein...</p>
                    </div>
                    
                    <!-- Error Screen -->
                    <div id="errorScreen" class="hidden absolute inset-0 flex flex-col items-center justify-center bg-gray-900 text-red-400 p-6 text-center z-10">
                        <i class="fa-solid fa-triangle-exclamation text-5xl mb-3"></i>
                        <h3 class="text-xl font-bold mb-1">Video Not Found</h3>
                        <p class="text-sm text-gray-400 max-w-md" id="errorMessage">Yeh video abhi available nahi hai ya scanner database me entry nahi mili.</p>
                        <button onclick="location.reload()" class="mt-4 px-4 py-2 bg-red-600 hover:bg-red-700 text-white text-sm rounded-lg transition">
                            Reload Page
                        </button>
                    </div>

                    <!-- Video Stream Iframe -->
                    <iframe id="videoIframe" src="" allowfullscreen allow="autoplay; encrypted-media"></iframe>
                </div>

                <!-- Info & Actions -->
                <div class="bg-gray-800 p-4 rounded-xl border border-gray-700 flex flex-wrap items-center justify-between gap-4">
                    <div class="flex items-center gap-3">
                        <h2 id="animeTitle" class="text-lg font-bold text-white">Loading Anime...</h2>
                        <span id="episodeBadge" class="bg-red-600 text-xs px-2.5 py-1 rounded-full font-semibold">EP --</span>
                    </div>
                    <div class="flex items-center gap-2">
                        <a id="downloadBtn" href="#" target="_blank" class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded-lg text-sm font-medium flex items-center gap-2 transition opacity-50 pointer-events-none">
                            <i class="fa-solid fa-download"></i> Download
                        </a>
                    </div>
                </div>
            </div>

            <!-- Episode Selector Sidebar -->
            <div class="bg-gray-800 p-4 rounded-xl border border-gray-700 h-fit">
                <h3 class="text-md font-bold mb-3 flex items-center gap-2 text-gray-200">
                    <i class="fa-solid fa-list-ul text-red-500"></i> Episodes List
                </h3>
                <div id="episodeList" class="grid grid-cols-4 sm:grid-cols-6 lg:grid-cols-4 gap-2 max-h-96 overflow-y-auto pr-1">
                    <!-- Episodes rendered dynamically -->
                </div>
            </div>

        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-gray-800 border-t border-gray-700 py-4 text-center text-xs text-gray-400">
        &copy; 2026 7anime. All rights reserved.
    </footer>

    <!-- JavaScript Engine -->
    <script>
        // Exact Render Services Endpoints
        const BOT1_API = "https://sevenanime-bot1-scanner.onrender.com";
        const BOT2_STREAM_BASE = "https://sevenanime-bot2-streamer.onrender.com";
        const BOT3_DOWNLOAD_BASE = "https://7anime-bot3-downloader.onrender.com";

        // Elements
        const iframe = document.getElementById('videoIframe');
        const loader = document.getElementById('loader');
        const errorScreen = document.getElementById('errorScreen');
        const errorMessage = document.getElementById('errorMessage');
        const animeTitleEl = document.getElementById('animeTitle');
        const episodeBadgeEl = document.getElementById('episodeBadge');
        const downloadBtn = document.getElementById('downloadBtn');
        const episodeListEl = document.getElementById('episodeList');

        // Extract parameters from URL (?anime=name&ep=1)
        const urlParams = new URLSearchParams(window.location.search);
        const animeQuery = urlParams.get('anime') || urlParams.get('id') || 'solo-leveling';
        const currentEp = parseInt(urlParams.get('ep')) || 1;

        async function loadVideoData() {
            try {
                showLoader();

                // 1. Fetch File Data from Scanner Bot 1
                const res = await fetch(`${BOT1_API}/api/anime?name=${encodeURIComponent(animeQuery)}&ep=${currentEp}`);
                
                if (!res.ok) {
                    throw new Error(`API Response Error: ${res.status}`);
                }

                const data = await res.json();

                if (!data || !data.file_id) {
                    throw new Error("Is episode ka file_id scanner database me nahi mil saka.");
                }

                // 2. Set Video Stream URL from Streamer Bot 2
                const streamUrl = `${BOT2_STREAM_BASE}/stream/${data.file_id}`;
                iframe.src = streamUrl;

                // 3. Set Download Link from Downloader Bot 3
                const downloadUrl = `${BOT3_DOWNLOAD_BASE}/download/${data.file_id}`;
                downloadBtn.href = downloadUrl;
                downloadBtn.classList.remove('opacity-50', 'pointer-events-none');

                // 4. Update UI Info
                animeTitleEl.textContent = data.title || animeQuery.replace(/-/g, ' ').toUpperCase();
                episodeBadgeEl.textContent = `EP ${currentEp}`;

                // 5. Render Episode Grid
                renderEpisodeList(data.total_episodes || 12, currentEp);

                hideLoader();

            } catch (err) {
                console.error("Video Load Failure:", err);
                showError(err.message || "Video load karte samay error aayi.");
            }
        }

        function renderEpisodeList(totalEpisodes, activeEpisode) {
            episodeListEl.innerHTML = '';
            for (let i = 1; i <= totalEpisodes; i++) {
                const btn = document.createElement('a');
                btn.href = `?anime=${encodeURIComponent(animeQuery)}&ep=${i}`;
                btn.textContent = i;
                btn.className = `p-2 text-center rounded text-sm font-semibold transition ${
                    i === activeEpisode 
                        ? 'bg-red-600 text-white shadow' 
                        : 'bg-gray-700 hover:bg-gray-600 text-gray-300'
                }`;
                episodeListEl.appendChild(btn);
            }
        }

        function showLoader() {
            loader.classList.remove('hidden');
            errorScreen.classList.add('hidden');
        }

        function hideLoader() {
            loader.classList.add('hidden');
        }

        function showError(msg) {
            loader.classList.add('hidden');
            errorMessage.textContent = msg;
            errorScreen.classList.remove('hidden');
        }

        window.addEventListener('DOMContentLoaded', loadVideoData);
    </script>
</body>
</html>
