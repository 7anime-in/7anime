<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>7anime - Watch & Download Anime Free</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #0b0c10;
            color: #c5c6c7;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        .hero-gradient {
            background: linear-gradient(180deg, rgba(11,12,16,0.2) 0%, rgba(11,12,16,0.8) 70%, #0b0c10 100%);
        }
        .card-hover:active, .card-hover:hover {
            transform: scale(0.98);
            transition: all 0.2s ease;
        }
        /* Hide scrollbar for category tabs on mobile */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        #searchDropdown::-webkit-scrollbar {
            width: 4px;
        }
        #searchDropdown::-webkit-scrollbar-thumb {
            background: #45a29e;
            border-radius: 4px;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col selection:bg-[#66fcf1] selection:text-black">

    <!-- ==================== NAVBAR ==================== -->
    <nav class="sticky top-0 z-50 bg-[#1f2833]/95 backdrop-blur-md border-b border-gray-800 px-3 py-2">
        <div class="max-w-7xl mx-auto flex flex-col gap-2">
            
            <!-- Top Row: Logo + Search -->
            <div class="flex items-center justify-between gap-2">
                <!-- Logo -->
                <a href="index.html" class="flex items-center gap-1.5 text-xl font-extrabold text-[#66fcf1] shrink-0">
                    <i class="fa-solid fa-circle-play text-2xl"></i>
                    <span>7<span class="text-white">anime</span></span>
                </a>

                <!-- Compact Search Input -->
                <div class="relative flex-1 max-w-md">
                    <input 
                        type="text" 
                        id="searchInput" 
                        oninput="handleSearch()"
                        onfocus="handleSearch()"
                        placeholder="Search anime, movie..." 
                        class="w-full bg-[#0b0c10] border border-gray-700/80 rounded-full py-1.5 px-3 pl-8 text-xs text-white placeholder-gray-500 focus:outline-none focus:border-[#66fcf1]"
                        autocomplete="off"
                    >
                    <i class="fa-solid fa-magnifying-glass absolute left-2.5 top-2 text-gray-400 text-xs"></i>

                    <!-- LIVE SEARCH DROPDOWN BOX -->
                    <div id="searchDropdown" class="hidden absolute left-0 right-0 top-full mt-2 bg-[#1f2833] border border-gray-700 rounded-xl shadow-2xl z-50 max-h-72 overflow-y-auto">
                        <!-- Search items rendered dynamically -->
                    </div>
                </div>
            </div>

            <!-- Horizontal Scrollable Category Tabs -->
            <div class="flex items-center gap-2 overflow-x-auto no-scrollbar py-1">
                <button onclick="filterCategory('all')" id="btn-all" class="cat-btn bg-[#66fcf1] text-black font-bold text-[11px] px-3 py-1 rounded-full transition shrink-0 flex items-center gap-1">
                    <i class="fa-solid fa-house text-[10px]"></i> Home
                </button>
                <button onclick="filterCategory('series')" id="btn-series" class="cat-btn bg-gray-800/80 text-gray-300 font-medium text-[11px] px-3 py-1 rounded-full border border-gray-700 transition shrink-0 flex items-center gap-1">
                    <i class="fa-solid fa-tv text-[10px]"></i> Series
                </button>
                <button onclick="filterCategory('movie')" id="btn-movie" class="cat-btn bg-gray-800/80 text-gray-300 font-medium text-[11px] px-3 py-1 rounded-full border border-gray-700 transition shrink-0 flex items-center gap-1">
                    <i class="fa-solid fa-film text-[10px]"></i> Movie
                </button>
                <button onclick="filterCategory('hentai')" id="btn-hentai" class="cat-btn bg-red-950/40 text-red-400 font-semibold text-[11px] px-3 py-1 rounded-full border border-red-800/50 transition shrink-0 flex items-center gap-1">
                    <i class="fa-solid fa-triangle-exclamation text-[10px]"></i> Hentai 18+
                </button>
            </div>

        </div>
    </nav>

    <!-- ==================== HERO BANNER ==================== -->
    <section id="heroSection" class="relative w-full h-[250px] sm:h-[340px] md:h-[420px] bg-cover bg-center flex items-end">
        <div class="absolute inset-0 hero-gradient"></div>
        
        <div class="relative max-w-7xl mx-auto px-4 pb-4 sm:pb-6 w-full z-10 flex flex-col gap-1.5">
            <span class="bg-[#66fcf1] text-black font-extrabold text-[10px] uppercase px-2 py-0.5 rounded w-fit tracking-wider">FEATURED</span>
            
            <h1 id="bannerTitle" class="text-2xl sm:text-4xl font-black text-white leading-tight drop-shadow-md">Loading...</h1>
            <p id="bannerDesc" class="text-xs sm:text-sm text-gray-300 max-w-xl line-clamp-2 text-ellipsis">Loading banner description...</p>
            
            <div class="flex items-center gap-2.5 mt-1">
                <a id="bannerPlayBtn" href="#" class="bg-[#66fcf1] hover:bg-[#45a29e] text-black font-bold px-4 py-1.5 rounded-lg text-xs flex items-center gap-1.5 transition">
                    <i class="fa-solid fa-play"></i> Watch Now
                </a>
                <a id="bannerDownloadBtn" href="#" class="bg-gray-800/90 hover:bg-gray-700 text-white font-medium px-3.5 py-1.5 rounded-lg text-xs flex items-center gap-1.5 border border-gray-700 transition">
                    <i class="fa-solid fa-download"></i> Download
                </a>
            </div>
        </div>
    </section>

    <!-- ==================== ANIME CARDS GRID ==================== -->
    <main class="max-w-7xl mx-auto px-3 sm:px-4 py-5 flex-1 w-full">
        <div class="flex items-center justify-between mb-4">
            <h2 id="gridTitle" class="text-base sm:text-xl font-bold text-white border-l-4 border-[#66fcf1] pl-2.5">Explore Anime</h2>
            <span id="totalCardsCount" class="text-[11px] text-gray-400">Loading...</span>
        </div>

        <!-- 2-Column Grid on Mobile, 3 on Tablet, 5 on Desktop -->
        <div id="animeGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-3 sm:gap-4">
            <!-- Skeleton Loading -->
            <div class="animate-pulse bg-[#1f2833] aspect-[2/3] rounded-xl"></div>
            <div class="animate-pulse bg-[#1f2833] aspect-[2/3] rounded-xl"></div>
        </div>
    </main>

    <!-- ==================== FOOTER ==================== -->
    <footer class="bg-[#1f2833] border-t border-gray-800 text-center py-4 text-xs text-gray-400 mt-auto">
        <p>© 2026 7anime Engine</p>
    </footer>

    <!-- ==================== JS LOGIC ==================== -->
    <script>
        const BOT1_API = "https://7anime-bot1-scanner.onrender.com";

        let allAnimeCards = [];
        let activeCategory = 'all';

        const defaultBanner = {
            title: "Solo Leveling",
            image: "https://m.media-amazon.com/images/M/MV5BODlhM2RmM2ItM2FkYi00ZGY2LTg2NzAtNjg4NTgwOGVhMDFkXkEyXkFqcGdeQXVyMTI1NDEyNTM5._V1_.jpg",
            description: "In a world where hunters battle monsters, Sung Jinwoo is known as the weakest hunter of all mankind.",
            play_slug: "solo_leveling"
        };

        function formatImageUrl(url) {
            if (!url) return "https://via.placeholder.com/300x420/1f2833/ffffff?text=7anime";
            const driveMatch = url.match(/\/d\/([a-zA-Z0-9_-]+)/) || url.match(/id=([a-zA-Z0-9_-]+)/);
            if (driveMatch && driveMatch[1]) {
                return `https://lh3.googleusercontent.com/d/${driveMatch[1]}`;
            }
            return url;
        }

        function getTypeBadge(type) {
            const normalizedType = (type || 'series').toLowerCase();
            if (normalizedType === 'movie') {
                return `<span class="bg-purple-600/80 backdrop-blur-md text-white font-bold text-[9px] px-1.5 py-0.5 rounded uppercase">Movie</span>`;
            } else if (normalizedType === 'hentai') {
                return `<span class="bg-red-600/80 backdrop-blur-md text-white font-bold text-[9px] px-1.5 py-0.5 rounded uppercase">18+</span>`;
            }
            return `<span class="bg-cyan-600/80 backdrop-blur-md text-white font-bold text-[9px] px-1.5 py-0.5 rounded uppercase">Series</span>`;
        }

        async function initPage() {
            await Promise.all([loadBannerAndAdminCards(), loadScannedAnime()]);
        }

        async function loadBannerAndAdminCards() {
            try {
                const res = await fetch(`./site_data.json?v=${Date.now()}`);
                if (!res.ok) throw new Error("site_data.json not found");
                
                const rawJson = await res.json();
                const cardsList = rawJson.cards ? Object.values(rawJson.cards) : [];

                renderHeroBanner(rawJson.banner || defaultBanner);
                if (cardsList.length > 0) {
                    mergeCards(cardsList);
                }
            } catch (err) {
                console.warn("Fallback banner loaded:", err);
                renderHeroBanner(defaultBanner);
            }
        }

        async function loadScannedAnime() {
            try {
                const res = await fetch(`${BOT1_API}/api/all-anime`);
                if (!res.ok) throw new Error("Bot 1 Offline");
                const scannedData = await res.json();

                const formattedCards = Object.keys(scannedData).map(slug => {
                    const item = scannedData[slug];
                    return {
                        title: item.title,
                        image: "https://via.placeholder.com/300x420/1f2833/66fcf1?text=" + encodeURIComponent(item.title),
                        genres: "Action, Anime",
                        type: item.type || "series",
                        rating: "8.5",
                        slug: slug
                    };
                });

                mergeCards(formattedCards);
            } catch (err) {
                console.warn("Could not fetch scanned anime:", err);
            }
        }

        function mergeCards(newCards) {
            newCards.forEach(card => {
                if (!card.type) card.type = 'series';
                const existingIndex = allAnimeCards.findIndex(c => c.slug === card.slug);
                if (existingIndex > -1) {
                    allAnimeCards[existingIndex] = { ...allAnimeCards[existingIndex], ...card };
                } else {
                    allAnimeCards.push(card);
                }
            });
            filterCategory(activeCategory);
        }

        function filterCategory(cat) {
            activeCategory = cat;

            document.querySelectorAll('.cat-btn').forEach(btn => {
                btn.className = "cat-btn bg-gray-800/80 text-gray-300 font-medium text-[11px] px-3 py-1 rounded-full border border-gray-700 transition shrink-0 flex items-center gap-1";
            });

            const activeBtn = document.getElementById(`btn-${cat}`);
            if (activeBtn) {
                if (cat === 'hentai') {
                    activeBtn.className = "cat-btn bg-red-600 text-white font-bold text-[11px] px-3 py-1 rounded-full transition shrink-0 flex items-center gap-1 shadow-sm";
                } else {
                    activeBtn.className = "cat-btn bg-[#66fcf1] text-black font-bold text-[11px] px-3 py-1 rounded-full transition shrink-0 flex items-center gap-1 shadow-sm";
                }
            }

            const titles = {
                'all': 'Explore Anime',
                'series': 'Anime Series',
                'movie': 'Anime Movies',
                'hentai': '18+ Hentai'
            };
            document.getElementById("gridTitle").innerText = titles[cat] || 'Explore Anime';

            let filtered = allAnimeCards;
            if (cat !== 'all') {
                filtered = allAnimeCards.filter(c => (c.type || 'series').toLowerCase() === cat);
            }

            renderCardsGrid(filtered);
        }

        function handleSearch() {
            const query = document.getElementById("searchInput").value.toLowerCase().trim();
            const dropdown = document.getElementById("searchDropdown");

            if (!query) {
                dropdown.classList.add("hidden");
                return;
            }

            const matches = allAnimeCards.filter(card => 
                card.title.toLowerCase().includes(query) || 
                (card.genres && card.genres.toLowerCase().includes(query)) ||
                (card.type && card.type.toLowerCase().includes(query))
            );

            if (matches.length === 0) {
                dropdown.innerHTML = `<div class="p-3 text-center text-xs text-gray-400">No matching anime found</div>`;
            } else {
                dropdown.innerHTML = matches.map(card => `
                    <a href="7anime_videoplayer.html?anime=${card.slug}" class="flex items-center gap-2.5 p-2 hover:bg-[#0b0c10] border-b border-gray-800/60 transition group">
                        <img src="${formatImageUrl(card.image)}" class="w-8 h-11 object-cover rounded shadow" onerror="this.src='https://via.placeholder.com/100x120/1f2833/ffffff?text=7A'">
                        <div class="flex flex-col flex-1 min-w-0">
                            <div class="flex items-center gap-1.5 mb-0.5">
                                ${getTypeBadge(card.type)}
                                <span class="text-[10px] text-gray-400 truncate">${card.genres || 'Anime'}</span>
                            </div>
                            <span class="text-xs font-semibold text-white group-hover:text-[#66fcf1] truncate">${card.title}</span>
                        </div>
                    </a>
                `).join("");
            }

            dropdown.classList.remove("hidden");
        }

        document.addEventListener("click", (e) => {
            const searchInput = document.getElementById("searchInput");
            const dropdown = document.getElementById("searchDropdown");
            if (!searchInput.contains(e.target) && !dropdown.contains(e.target)) {
                dropdown.classList.add("hidden");
            }
        });

        function renderHeroBanner(banner) {
            const bgImg = formatImageUrl(banner.image);
            document.getElementById("heroSection").style.backgroundImage = `url('${bgImg}')`;
            document.getElementById("bannerTitle").innerText = banner.title || "Solo Leveling";
            document.getElementById("bannerDesc").innerText = banner.description || "";
            document.getElementById("bannerPlayBtn").href = `7anime_videoplayer.html?anime=${banner.play_slug || 'solo_leveling'}`;
            document.getElementById("bannerDownloadBtn").href = `download.html?anime=${banner.play_slug || 'solo_leveling'}`;
        }

        function renderCardsGrid(cards) {
            const grid = document.getElementById("animeGrid");
            document.getElementById("totalCardsCount").innerText = `${cards.length} Titles`;

            if (cards.length === 0) {
                grid.innerHTML = `<div class="col-span-full text-center py-10 text-xs text-gray-500">No content found.</div>`;
                return;
            }

            grid.innerHTML = cards.map(card => `
                <div class="bg-[#1f2833] rounded-lg overflow-hidden shadow border border-gray-800/80 card-hover flex flex-col justify-between">
                    <a href="7anime_videoplayer.html?anime=${card.slug}">
                        <div class="relative aspect-[2/3] w-full overflow-hidden bg-gray-900">
                            <img src="${formatImageUrl(card.image)}" alt="${card.title}" class="w-full h-full object-cover" onerror="this.src='https://via.placeholder.com/300x420/1f2833/ffffff?text=7anime'">
                            
                            <div class="absolute top-1.5 left-1.5">
                                ${getTypeBadge(card.type)}
                            </div>

                            <span class="absolute top-1.5 right-1.5 bg-black/80 text-[#66fcf1] font-bold text-[10px] px-1.5 py-0.5 rounded flex items-center gap-1 backdrop-blur-sm">
                                <i class="fa-solid fa-star text-yellow-400 text-[9px]"></i> ${card.rating || '8.0'}
                            </span>
                        </div>
                    </a>
                    <div class="p-2 flex flex-col justify-between flex-1">
                        <div>
                            <a href="7anime_videoplayer.html?anime=${card.slug}" class="font-bold text-white text-xs hover:text-[#66fcf1] line-clamp-1">
                                ${card.title}
                            </a>
                        </div>
                        <div class="flex items-center justify-between gap-1.5 mt-2 pt-1.5 border-t border-gray-800">
                            <a href="7anime_videoplayer.html?anime=${card.slug}" class="flex-1 bg-[#66fcf1] hover:bg-[#45a29e] text-black text-[11px] font-bold py-1 rounded text-center transition">
                                Watch
                            </a>
                            <a href="download.html?anime=${card.slug}" class="bg-gray-800 hover:bg-gray-700 text-white text-[11px] p-1 rounded transition border border-gray-700" title="Download">
                                <i class="fa-solid fa-download"></i>
                            </a>
                        </div>
                    </div>
                </div>
            `).join("");
        }

        window.addEventListener("DOMContentLoaded", initPage);
    </script>
</body>
</html>
