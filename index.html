<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>7Anime Pro - Watch Your Favorite Anime</title>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-color: #0b0c10;
            --card-bg: #1f2833;
            --text-color: #ffffff;
            --accent-orange: #ff5500;
            --accent-red: #ff0055;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            overflow-x: hidden;
        }

        /* Header / Navbar */
        .main-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 20px;
            background: #12131a;
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logo {
            cursor: pointer;
            font-weight: 800;
            font-size: 20px;
            letter-spacing: 1px;
        }

        .fire-seven {
            color: var(--accent-orange);
            font-size: 24px;
        }

        .fire-text {
            background: linear-gradient(45deg, var(--accent-orange), var(--accent-red));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .desktop-nav ul {
            display: flex;
            list-style: none;
            gap: 20px;
        }

        .desktop-nav a {
            color: #ccc;
            text-decoration: none;
            font-weight: 500;
            transition: 0.3s;
        }

        .desktop-nav a:hover, .desktop-nav a.active {
            color: var(--accent-orange);
        }

        .search-box {
            position: relative;
            display: flex;
            align-items: center;
        }

        .search-box input {
            background: var(--card-bg);
            border: 1px solid #333;
            padding: 8px 35px 8px 15px;
            border-radius: 20px;
            color: #fff;
            outline: none;
            font-size: 13px;
        }

        .search-box i {
            position: absolute;
            right: 12px;
            color: #888;
            cursor: pointer;
        }

        /* Hero Banner */
        .hero {
            position: relative;
            padding: 50px 20px;
            background: linear-gradient(to right, rgba(11, 12, 16, 0.95), rgba(11, 12, 16, 0.4)), url('https://lh3.googleusercontent.com/d/1DrYU7Rcf8h1JHkkakd6ks9MAiFYsnj4V') center/cover;
            min-height: 300px;
            display: flex;
            align-items: center;
        }

        .hero-content {
            max-width: 600px;
        }

        .badge {
            background: var(--accent-orange);
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: bold;
        }

        .hero-title {
            font-size: 32px;
            margin: 10px 0 8px;
        }

        .hero-desc {
            color: #ddd;
            font-size: 13px;
            line-height: 1.4;
            margin-bottom: 15px;
        }

        /* Buttons */
        .btn {
            padding: 8px 18px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
            transition: 0.3s;
        }

        .btn-primary {
            background: var(--accent-orange);
            color: #fff;
        }

        .btn-primary:hover {
            background: #e04b00;
        }

        /* Main Anime Grid Desktop */
        .container {
            padding: 25px 20px;
        }

        .section-title {
            font-size: 18px;
            margin-bottom: 18px;
            border-left: 4px solid var(--accent-orange);
            padding-left: 10px;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 15px;
        }

        .anime-card {
            background: var(--card-bg);
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .anime-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 6px 15px rgba(255, 85, 0, 0.3);
        }

        .card-img-container {
            position: relative;
            width: 100%;
            padding-top: 140%;
        }

        .card-img-container img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .rating-badge {
            position: absolute;
            top: 6px;
            right: 6px;
            background: rgba(0, 0, 0, 0.8);
            color: #ffca28;
            padding: 3px 6px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: bold;
        }

        .card-info {
            padding: 10px;
        }

        .card-title {
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 3px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .card-tags {
            font-size: 11px;
            color: #888;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* MOBILE RESPONSIVE FIX (3 Cards Per Row) */
        @media (max-width: 600px) {
            .main-header {
                padding: 10px 12px;
            }

            .logo {
                font-size: 17px;
            }

            .search-box input {
                width: 140px;
                padding: 6px 28px 6px 10px;
                font-size: 11px;
            }

            .container {
                padding: 15px 10px;
            }

            .grid-container {
                grid-template-columns: repeat(3, 1fr); /* Mobile screen par 3 cards aayenge */
                gap: 8px;
            }

            .card-info {
                padding: 6px 4px;
            }

            .card-title {
                font-size: 11px;
                line-height: 1.2;
            }

            .card-tags {
                font-size: 9px;
            }

            .rating-badge {
                font-size: 9px;
                padding: 2px 4px;
                top: 4px;
                right: 4px;
            }

            .hero {
                padding: 30px 15px;
                min-height: 220px;
            }

            .hero-title {
                font-size: 22px;
            }

            .hero-desc {
                font-size: 11px;
                display: -webkit-box;
                -webkit-line-clamp: 2;
                -webkit-box-orient: vertical;
                overflow: hidden;
            }
        }

        footer {
            background: #12131a;
            padding: 20px;
            text-align: center;
            margin-top: 40px;
            border-top: 1px solid #222;
        }
    </style>
</head>
<body>

    <!-- Header / Navbar -->
    <header class="main-header">
        <div class="header-left">
            <div class="logo fire-logo" onclick="window.location.href='index.html'">
                <span class="fire-seven">7</span><span class="fire-text">ANIME PRO 🔥</span>
            </div>
        </div>

        <div class="search-box">
            <input type="text" id="globalSearchInput" onkeydown="handleSearch(event)" placeholder="Search anime...">
            <i class="fa-solid fa-magnifying-glass"></i>
        </div>
    </header>

    <!-- Hero Banner -->
    <section class="hero">
        <div class="hero-content">
            <span class="badge"><i class="fa-solid fa-fire"></i> Trending #1</span>
            <h1 class="hero-title">Solo Leveling</h1>
            <p class="hero-desc">Sung Jin-Woo continues his journey to become the strongest hunter in a world full of monsters.</p>
            <div class="hero-buttons">
                <button class="btn btn-primary" onclick="openAnimePage('solo_leveling')">
                    <i class="fa-solid fa-play"></i> Watch Now
                </button>
            </div>
        </div>
    </section>

    <!-- Main Anime Grid -->
    <main class="container">
        <h2 class="section-title"><i class="fa-solid fa-fire-flame-curated"></i> Trending Anime</h2>

        <div class="grid-container" id="animeGrid">
            
            <!-- 1. Solo Leveling Card -->
            <div class="anime-card" onclick="openAnimePage('solo_leveling')">
                <div class="card-img-container">
                    <img src="https://lh3.googleusercontent.com/d/1DrYU7Rcf8h1JHkkakd6ks9MAiFYsnj4V" alt="Solo Leveling">
                    <span class="rating-badge"><i class="fa-solid fa-star"></i> 9.4</span>
                </div>
                <div class="card-info">
                    <div class="card-title">Solo Leveling</div>
                    <div class="card-tags">Action, Fantasy</div>
                </div>
            </div>

            <!-- 2. Hell Mode Card -->
            <div class="anime-card" onclick="openAnimePage('hell_mode')">
                <div class="card-img-container">
                    <img src="https://lh3.googleusercontent.com/d/1hZPMLLUNMOVG8DmSd1eGd5Nmdgh6AUYZ" alt="Hell Mode">
                    <span class="rating-badge"><i class="fa-solid fa-star"></i> 8.8</span>
                </div>
                <div class="card-info">
                    <div class="card-title">Hell Mode</div>
                    <div class="card-tags">Isekai, Action</div>
                </div>
            </div>

            <!-- 3. One Piece Card -->
            <div class="anime-card" onclick="openAnimePage('one_piece')">
                <div class="card-img-container">
                    <img src="https://lh3.googleusercontent.com/d/1DrYU7Rcf8h1JHkkakd6ks9MAiFYsnj4V" alt="One Piece">
                    <span class="rating-badge"><i class="fa-solid fa-star"></i> 9.6</span>
                </div>
                <div class="card-info">
                    <div class="card-title">One Piece</div>
                    <div class="card-tags">Action, Adventure</div>
                </div>
            </div>

        </div>
    </main>

    <footer>
        <p style="color: #666; font-size: 12px;">© 7Anime Pro. All rights reserved.</p>
    </footer>

    <script>
        // REDIRECTION FIX: Directly pointing to 7anime_videoplayer.html
        function openAnimePage(animeSlug) {
            window.location.href = `7anime_videoplayer.html?anime=${encodeURIComponent(animeSlug)}`;
        }

        function handleSearch(e) {
            if (e.key === 'Enter') {
                const query = e.target.value.trim().toLowerCase().replace(/\s+/g, '_');
                if (query) {
                    openAnimePage(query);
                }
            }
        }
    </script>
</body>
</html>
