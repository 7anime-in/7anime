<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>7anime - Watch & Download Anime</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- ==================== SOCIAL BAR AD ==================== -->
    <script src="https://seenimplieddump.com/77/c2/24/77c224c37e85a092112b37e82c893705.js"></script>

    <style>
        body {
            background-color: #0b0c10;
            color: #c5c6c7;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col selection:bg-[#66fcf1] selection:text-black">

    <!-- ==================== NAVBAR ==================== -->
    <nav class="sticky top-0 z-[60] bg-[#1f2833]/95 backdrop-blur-md border-b border-gray-800 px-4 py-3">
        <div class="max-w-5xl mx-auto flex items-center justify-between">
            <a href="index.html" class="flex items-center gap-1.5 text-xl font-extrabold text-[#66fcf1]">
                <i class="fa-solid fa-arrow-left text-lg"></i>
                <span>Back to Home</span>
            </a>
            <span id="navAnimeTitle" class="text-xs font-semibold text-white truncate max-w-[200px] sm:max-w-sm">Loading...</span>
        </div>
    </nav>

    <!-- ==================== MAIN CONTENT ==================== -->
    <main class="max-w-5xl mx-auto px-3 sm:px-4 py-5 flex-1 w-full flex flex-col gap-6">
        
        <!-- Anime Banner & Info Section -->
        <div class="bg-[#1f2833] border border-gray-800 rounded-2xl p-4 sm:p-6 shadow-xl flex flex-col md:flex-row gap-5 items-center md:items-start">
            <div class="w-36 sm:w-48 aspect-[2/3] bg-gray-900 rounded-xl overflow-hidden shrink-0 shadow-lg border border-gray-700">
                <img id="animePoster" src="https://via.placeholder.com/300x420/0b0c10/66fcf1?text=7anime" class="w-full h-full object-cover" alt="Poster">
            </div>
            <div class="flex flex-col flex-1 text-center md:text-left gap-2">
                <div class="flex items-center justify-center md:justify-start gap-2 flex-wrap">
                    <span id="animeTypeBadge" class="bg-cyan-600 text-white text-[10px] font-bold px-2 py-0.5 rounded uppercase">Series</span>
                    <span class="bg-black/50 text-[#66fcf1] text-[10px] font-bold px-2 py-0.5 rounded border border-[#66fcf1]/30 flex items-center gap-1">
                        <i class="fa-solid fa-star text-yellow-400"></i> <span id="animeRating">8.5</span>
                    </span>
                </div>
                <h1 id="animeTitle" class="text-xl sm:text-3xl font-black text-white">Loading Anime...</h1>
                <p id="animeGenres" class="text-xs text-[#66fcf1] font-medium">Action, Fantasy</p>
                <p id="animeSynopsis" class="text-xs sm:text-sm text-gray-300 leading-relaxed mt-1">Fetching data using Master Index line pointers...</p>
                
                <!-- Seasons Selector -->
                <div class="mt-3 flex flex-col gap-1.5">
                    <span class="text-xs font-bold text-gray-400">Select Season:</span>
                    <div id="seasonsBox" class="flex items-center gap-2 flex-wrap justify-center md:justify-start"></div>
                </div>
            </div>
        </div>

        <!-- Episodes & Download Links Section -->
        <div class="bg-[#1f2833] border border-gray-800 rounded-2xl p-4 sm:p-6 shadow-xl flex flex-col gap-4">
            <div class="flex items-center justify-between border-b border-gray-800 pb-3">
                <h2 class="text-base sm:text-lg font-bold text-white flex items-center gap-2">
                    <i class="fa-solid fa-video text-[#66fcf1]"></i> Episodes & Downloads
                </h2>
                <div id="qualitiesBox" class="flex items-center gap-1.5 flex-wrap"></div>
            </div>

            <div id="episodesListContainer" class="flex flex-col gap-2.5">
                <div class="text-center py-8 text-xs text-gray-500">Loading episodes...</div>
            </div>
        </div>

    </main>

    <!-- ==================== FOOTER ==================== -->
    <footer class="bg-[#1f2833] border-t border-gray-800 text-center py-4 text-xs text-gray-400 mt-auto">
        <p>© 2026 7anime Engine</p>
    </footer>

    <!-- ==================== JS LOGIC (LINE-POINTER MASTER INDEX FETCHING) ==================== -->
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const animeSlug = urlParams.get('anime') || 'solo_leveling';
        const categoryParam = (urlParams.get('cat') || 'series').toLowerCase();

        let animeData = null;
        let selectedQuality = '480p';
        let selectedSeason = 'Season 1';

        async function initAnimePage() {
            let indexFilename = 'anime_index.json';
            if (categoryParam.includes('movie')) indexFilename = 'movie_index.json';
            else if (categoryParam.includes('hentai') || categoryParam.includes('18') || categoryParam.includes('hatai') || categoryParam.includes('pulse')) indexFilename = 'hantai_index.json';

            try {
                // 1. Fetch Master Index
                const idxRes = await fetch(`./${indexFilename}?v=${Date.now()}`);
                if (!idxRes.ok) throw new Error("Index file not found");
                const indexJson = await idxRes.json();
                
                const entry = indexJson[animeSlug];
                if (!entry) {
                    document.getElementById('animeTitle').innerText = "Anime Not Found!";
                    document.getElementById('animeSynopsis').innerText = "The requested anime slug does not exist in the Master Index.";
                    return;
                }

                // 2. Fetch Card details (Using card_file & card_line pointer info)
                let cardDetails = { title: animeSlug.replace(/_/g, ' ').toUpperCase(), image: "", genres: "Action, Anime", rating: "8.5", synopsis: "Loaded via Master Index Line Pointer." };
                if (entry.card_file) {
                    try {
                        const cardRes = await fetch(`./${entry.card_file}?v=${Date.now()}`);
                        if (cardRes.ok) {
                            const cardJson = await cardRes.json();
                            const cardsDict = cardJson.cards || cardJson;
                            if (cardsDict[animeSlug]) {
                                let c = cardsDict[animeSlug];
                                cardDetails.title = c.title || cardDetails.title;
                                cardDetails.image = c.image || c.poster || "";
                                cardDetails.genres = c.genres || cardDetails.genres;
                                cardDetails.rating = c.rating || cardDetails.rating;
                                cardDetails.synopsis = c.description || c.synopsis || cardDetails.synopsis;
                            }
                        }
                    } catch (e) {}
                }

                // 3. Fetch Quality Video Files (Using video_files pointers & exact line numbers)
                let videoFilesData = {};
                let availableQualities = entry.qualities || Object.keys(entry.video_files || {});
                if (availableQualities.length > 0) selectedQuality = availableQualities[0];

                for (let q of availableQualities) {
                    let vInfo = entry.video_files[q];
                    let vFilename = typeof vInfo === 'string' ? vInfo : (vInfo ? vInfo.file : null);
                    let vLineNum = (vInfo && typeof vInfo === 'object') ? vInfo.line : null;

                    if (vFilename) {
                        try {
                            const vRes = await fetch(`./${vFilename}?v=${Date.now()}`);
                            if (vRes.ok) {
                                const vJson = await vRes.json();
                                const vDict = vJson.cards || vJson;
                                if (vDict[animeSlug]) {
                                    videoFilesData[q] = vDict[animeSlug];
                                }
                            }
                        } catch (e) {}
                    }
                }

                animeData = {
                    title: cardDetails.title,
                    image: cardDetails.image,
                    genres: cardDetails.genres,
                    rating: cardDetails.rating,
                    synopsis: cardDetails.synopsis,
                    seasons: entry.seasons || ["Season 1"],
                    qualities: availableQualities,
                    videoFiles: videoFilesData,
                    cardFile: entry.card_file,
                    cardLine: entry.card_line
                };

                renderAnimeUI();

            } catch (err) {
                document.getElementById('animeTitle').innerText = "Error Loading Anime";
                document.getElementById('animeSynopsis').innerText = "Could not fetch data from Master Index.";
            }
        }

        function formatImageUrl(url) {
            if (!url) return "https://via.placeholder.com/300x420/0b0c10/66fcf1?text=7anime";
            const driveMatch = url.match(/\/d\/([a-zA-Z0-9_-]+)/) || url.match(/id=([a-zA-Z0-9_-]+)/);
            if (driveMatch && driveMatch[1]) {
                return `https://lh3.googleusercontent.com/d/${driveMatch[1]}`;
            }
            return url;
        }

        function renderAnimeUI() {
            if (!animeData) return;

            document.getElementById('navAnimeTitle').innerText = animeData.title;
            document.getElementById('animeTitle').innerText = animeData.title;
            document.getElementById('animePoster').src = formatImageUrl(animeData.image);
            document.getElementById('animeRating').innerText = animeData.rating;
            document.getElementById('animeGenres').innerText = animeData.genres;
            document.getElementById('animeSynopsis').innerText = animeData.synopsis;

            // Render Seasons
            const seasonsBox = document.getElementById('seasonsBox');
            if (animeData.seasons && animeData.seasons.length > 0) {
                selectedSeason = animeData.seasons[0];
                seasonsBox.innerHTML = animeData.seasons.map(s => `
                    <button onclick="selectSeason('${s}')" id="season-btn-${s}" class="px-3 py-1 rounded-lg text-xs font-bold transition ${s === selectedSeason ? 'bg-[#66fcf1] text-black shadow' : 'bg-gray-800 text-gray-300 border border-gray-700'}">
                        ${s}
                    </button>
                `).join('');
            }

            // Render Qualities
            const qualitiesBox = document.getElementById('qualitiesBox');
            if (animeData.qualities && animeData.qualities.length > 0) {
                qualitiesBox.innerHTML = animeData.qualities.map(q => `
                    <button onclick="selectQuality('${q}')" id="quality-btn-${q}" class="px-2.5 py-1 rounded-md text-[11px] font-bold uppercase transition ${q === selectedQuality ? 'bg-cyan-600 text-white' : 'bg-gray-800 text-gray-400 border border-gray-700'}">
                        ${q}
                    </button>
                `).join('');
            }

            renderEpisodes();
        }

        function selectSeason(season) {
            selectedSeason = season;
            document.querySelectorAll('[id^="season-btn-"]').forEach(btn => {
                btn.className = "px-3 py-1 rounded-lg text-xs font-bold transition bg-gray-800 text-gray-300 border border-gray-700";
            });
            const active = document.getElementById(`season-btn-${season}`);
            if (active) active.className = "px-3 py-1 rounded-lg text-xs font-bold transition bg-[#66fcf1] text-black shadow";
            renderEpisodes();
        }

        function selectQuality(q) {
            selectedQuality = q;
            document.querySelectorAll('[id^="quality-btn-"]').forEach(btn => {
                btn.className = "px-2.5 py-1 rounded-md text-[11px] font-bold uppercase transition bg-gray-800 text-gray-400 border border-gray-700";
            });
            const active = document.getElementById(`quality-btn-${q}`);
            if (active) active.className = "px-2.5 py-1 rounded-md text-[11px] font-bold uppercase transition bg-cyan-600 text-white";
            renderEpisodes();
        }

        function renderEpisodes() {
            const container = document.getElementById('episodesListContainer');
            if (!animeData || !animeData.videoFiles || !animeData.videoFiles[selectedQuality]) {
                container.innerHTML = `<div class="text-center py-8 text-xs text-gray-500">No download links available for ${selectedQuality.toUpperCase()} yet.</div>`;
                return;
            }

            let qualityObj = animeData.videoFiles[selectedQuality];
            let downloads = qualityObj.downloads || {};
            let streamLink = qualityObj.stream_link || "#";

            let keys = Object.keys(downloads);
            if (keys.length === 0) {
                container.innerHTML = `<div class="text-center py-8 text-xs text-gray-500">No episodes found.</div>`;
                return;
            }

            container.innerHTML = keys.map((dlKey, idx) => {
                let dlUrl = downloads[dlKey];
                return `
                    <div class="bg-[#0b0c10] border border-gray-800 rounded-xl p-3 flex items-center justify-between gap-3 hover:border-gray-700 transition">
                        <div class="flex items-center gap-2.5 min-w-0">
                            <div class="w-8 h-8 rounded-lg bg-cyan-950/60 border border-cyan-800 text-[#66fcf1] flex items-center justify-center font-bold text-xs shrink-0">
                                ${idx + 1}
                            </div>
                            <div class="flex flex-col min-w-0">
                                <span class="text-xs font-bold text-white truncate">${dlKey}</span>
                                <span class="text-[10px] text-gray-400 uppercase">${selectedQuality} • Dual Audio (Indexed at Line ${animeData.cardLine || 1})</span>
                            </div>
                        </div>
                        <div class="flex items-center gap-2 shrink-0">
                            <a href="${streamLink}" target="_blank" class="bg-gray-800 hover:bg-gray-700 text-white text-xs font-semibold px-3 py-1.5 rounded-lg border border-gray-700 transition flex items-center gap-1.5">
                                <i class="fa-solid fa-play text-[10px]"></i> Watch
                            </a>
                            <a href="${dlUrl}" target="_blank" class="bg-[#66fcf1] hover:bg-[#45a29e] text-black text-xs font-bold px-3 py-1.5 rounded-lg transition flex items-center gap-1.5 shadow-sm">
                                <i class="fa-solid fa-download text-[10px]"></i> Download
                            </a>
                        </div>
                    </div>
                `;
            }).join('');
        }

        window.addEventListener("DOMContentLoaded", initAnimePage);
    </script>
</body>
</html>
