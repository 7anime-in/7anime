<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>7anime - Watch & Download Anime Free</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #0b0c10;
            color: #c5c6c7;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .hero-gradient {
            background: linear-gradient(0deg, #0b0c10 0%, rgba(11,12,16,0.7) 50%, rgba(11,12,16,0.3) 100%);
        }
        .card-hover:hover {
            transform: translateY(-6px);
            transition: all 0.3s ease;
        }
        /* Custom scrollbar for search dropdown */
        #searchDropdown::-webkit-scrollbar {
            width: 6px;
        }
        #searchDropdown::-webkit-scrollbar-thumb {
            background: #45a29e;
            border-radius: 4px;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- ==================== NAVBAR ==================== -->
    <nav class="sticky top-0 z-50 bg-[#1f2833]/95 backdrop-blur-md border-b border-gray-800 px-4 py-3 shadow-lg">
        <div class="max-w-7xl mx-auto flex flex-col gap-3">
            
            <!-- Top Header: Logo + Search Bar -->
            <div class="flex flex-col md:flex-row items-center justify-between gap-3">
                <!-- Logo -->
                <div class="flex items-center justify-between w-full md:w-auto">
                    <a href="index.html" class="flex items-center gap-2 text-2xl font-extrabold text-[#66fcf1]">
                        <i class="fa-solid fa-play-circle text-3xl"></i>
                        <span>7<span class="text-white">anime</span></span>
                    </a>
                    <span class="text-xs bg-[#45a29e] text-black px-2 py-0.5 rounded font-bold md:hidden">v2.0</span>
                </div>

                <!-- Search Bar Container with Dropdown -->
                <div class="relative w-full md:w-96">
                    <input 
                        type="text" 
                        id="searchInput" 
                        oninput="handleSearch()"
                        onfocus="handleSearch()"
                        placeholder="Search anime, movie, hentai..." 
                        class="w-full bg-[#0b0c10] border border-gray-700 rounded-full py-2 px-4 pl-10 text-sm text-white focus:outline-none focus:border-[#66fcf1]"
                        autocomplete="off"
                    >
                    <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-3 text-gray-400 text-sm"></i>

                    <!-- LIVE SEARCH DROPDOWN BOX -->
                    <div id="searchDropdown" class="hidden absolute left-0 right-0 top-full mt-2 bg-[#1f2833] border border-gray-700 rounded-xl shadow-2xl z-50 max-h-80 overflow-y-auto">
                        <!-- Search items rendered dynamically -->
                    </div>
                </div>
            </div>

            <!-- SEARCH BAR KE NECHE 4 FUNCTIONAL CATEGORY BUTTONS -->
            <div class="flex items-center justify-center md:justify-start gap-2 pt-1 border-t border-gray-800/80 overflow-x-auto pb-1">
                <button onclick="filterCategory('all')" id="btn-all" class="cat-btn bg-[#66fcf1] text-black font-bold text-xs px-4 py-1.5 rounded-full transition flex items-center gap-1.5 whitespace-nowrap">
                    <i class="fa-solid fa-house"></i> Home
                </button>
                <button onclick="filterCategory('series')" id="btn-series" class="cat-btn bg-gray-800 hover:bg-gray-700 text-gray-300 font-semibold text-xs px-4 py-1.5 rounded-full border border-gray-700 transition flex items-center gap-1.5 whitespace-nowrap">
                    <i class="fa-solid fa-tv"></i> Series
                </button>
                <button onclick="filterCategory('movie')" id="btn-movie" class="cat-btn bg-gray-800 hover:bg-gray-700 text-gray-300 font-semibold text-xs px-4 py-1.5 rounded-full border border-gray-700 transition flex items-center gap-1.5 whitespace-nowrap">
                    <i class="fa-solid fa-film"></i> Movie
                </button>
                <button onclick="filterCategory('hentai')" id="btn-hentai" class="cat-btn bg-red-950/50 hover:bg-red-900/60 text-red-400 font-bold text-xs px-4 py-1.5 rounded-full border border-red-800/60 transition flex items-center gap-1.5 whitespace-nowrap">
                    <i class="fa-solid fa-triangle-exclamation"></i> Hentai (18+ Only)
                </button>
            </div>

        </div>
    </nav>

    <!-- ==================== HERO BANNER ==================== -->
    <section id="heroSection" class="relative w-full h-[380px] md:h-[480px] bg-cover bg-center flex items-end">
        <div class="absolute inset-0 hero-gradient"></div>
        <div class="relative max-w-7xl mx-auto px-4 pb-8 w-full z-10 flex flex-col gap-3">
            <span class="bg-[#66fcf1] text-black font-bold text-xs uppercase px-2.5 py-1 rounded w-fit">Featured Anime</span>
            <h1 id="bannerTitle" class="text-3xl md:text-5xl font-black text-white drop-shadow-md">Loading Hero Banner...</h1>
            <p id="bannerDesc" class="text-sm md:text-base text-gray-300 max-w-2xl line-clamp-3">Please wait while content loads...</p>
            
            <div class="flex items-center gap-4 mt-2">
                <a id="bannerPlayBtn" href="#" class="bg-[#66fcf1] hover:bg-[#45a29e] text-black font-bold px-6 py-2.5 rounded-lg flex items-center gap-2 transition">
                    <i class="fa-solid fa-play"></i> Watch Now
                </a>
                <a id="bannerDownloadBtn" href="#" class="bg-gray-800 hover:bg-gray-700 text-white font-semibold px-5 py-2.5 rounded-lg flex items-center gap-2 transition border border-gray-700">
                    <i class="fa-solid fa-download"></i> Download
                </a>
            </div>
        </div>
    </section>

    <!-- ==================== ANIME CARDS GRID ==================== -->
    <main class="max-w-7xl mx-auto px-4 py-8 flex-1 w-full">
        <div class="flex items-center justify-between mb-6">
            <h2 id="gridTitle" class="text-xl md:text-2xl font-bold text-white border-l-4 border-[#66fcf1] pl-3">Explore Anime</h2>
            <span id="totalCardsCount" class="text-xs text-gray-400">Loading library...</span>
        </div>

        <!-- Grid Container -->
        <div id="animeGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4 md:gap-6">
            <!-- Skeleton Loading Placeholders -->
            <div class="animate-pulse bg-[#1f2833] h-64 rounded-xl"></div>
            <div class="animate-pulse bg-[#1f2833] h-64 rounded-xl"></div>
            <div class="animate-pulse bg-[#1f2833] h-64 rounded-xl"></div>
            <div class="animate-pulse bg-[#1f2833] h-64 rounded-xl"></div>
            <div class="animate-pulse bg-[#1f2833] h-64 rounded-xl"></div>
        </div>
    </main>

    <!-- ==================== FOOTER ==================== -->
    <footer class="bg-[#1f2833] border-t border-gray-800 text-center py-6 text-sm text-gray-400 mt-auto">
        <p>© 2026 7anime Engine. Powered by Telegram Stream Engine.</p>
    </footer>

    <!-- ==================== JS LOGIC ==================== -->
    <script>
        const BOT1_API = "https://7anime-bot1-scanner.onrender.com";

        let allAnimeCards = [];
        let activeCategory = 'all';

        const defaultBanner = {
            title: "Solo Leveling",
            image: "https://m.media-amazon.com/images/M/MV5BODlhM2RmM2ItM2FkYi00ZGY2LTg2NzAtNjg4NTgwOGVhMDFkXkEyXkFqcGdeQXVyMTI1NDEyNTM5._V1_.jpg",
            description: "In a world where hunters must battle deadly monsters, Sung Jinwoo is known as the weakest hunter of all mankind.",
            play_slug: "solo_leveling"
        };

        // Convert Google Drive Links to Direct Display Images
        function formatImageUrl(url) {
            if (!url) return "https://via.placeholder.com/300x420/1f2833/ffffff?text=7anime";
            const driveMatch = url.match(/\/d\/([a-zA-Z0-9_-]+)/) || url.match(/id=([a-zA-Z0-9_-]+)/);
            if (driveMatch && driveMatch[1]) {
                return `https://lh3.googleusercontent.com/d/${driveMatch[1]}`;
            }
            return url;
        }

        // Return Styled Type Badge for Movie / Hentai / Series
        function getTypeBadge(type) {
            const normalizedType = (type || 'series').toLowerCase();
            if (normalizedType === 'movie') {
                return `<span class="bg-purple-500/20 text-purple-400 border border-purple-500/40 font-bold text-[10px] px-2 py-0.5 rounded uppercase">Movie</span>`;
            } else if (normalizedType === 'hentai') {
                return `<span class="bg-red-500/20 text-red-400 border border-red-500/40 font-bold text-[10px] px-2 py-0.5 rounded uppercase">18+ Hentai</span>`;
            }
            return `<span class="bg-cyan-500/20 text-[#66fcf1] border border-cyan-500/40 font-bold text-[10px] px-2 py-0.5 rounded uppercase">Series</span>`;
        }

        async function initPage() {
            await Promise.all([loadBannerAndAdminCards(), loadScannedAnime()]);
        }

        // Direct Fetch from site_data.json
        async function loadBannerAndAdminCards() {
            try {
                const res = await fetch(`./site_data.json?v=${Date.now()}`);
                if (!res.ok) throw new Error("site_data.json not found");
                
                const rawJson = await res.json();
                const cardsList = rawJson.cards ? Object.values(rawJson.cards) : [];

                renderHeroBanner(rawJson.banner || defaultBanner);
                if (cardsList.length > 0) {
                    mergeCards(cardsList);
                }
            } catch (err) {
                console.warn("Fallback to default banner:", err);
                renderHeroBanner(defaultBanner);
            }
        }

        // Fetch Scanned Anime from Bot 1
        async function loadScannedAnime() {
            try {
                const res = await fetch(`${BOT1_API}/api/all-anime`);
                if (!res.ok) throw new Error("Bot 1 Offline");
                const scannedData = await res.json();

                const formattedCards = Object.keys(scannedData).map(slug => {
                    const item = scannedData[slug];
                    return {
                        title: item.title,
                        image: "https://via.placeholder.com/300x420/1f2833/66fcf1?text=" + encodeURIComponent(item.title),
                        genres: "Action, Anime",
                        type: item.type || "series",
                        rating: "8.5",
                        slug: slug
                    };
                });

                mergeCards(formattedCards);
            } catch (err) {
                console.warn("Could not fetch scanned anime from Bot 1:", err);
            }
        }

        function mergeCards(newCards) {
            newCards.forEach(card => {
                // Ensure default type is 'series' if not specified
                if (!card.type) card.type = 'series';

                const existingIndex = allAnimeCards.findIndex(c => c.slug === card.slug);
                if (existingIndex > -1) {
                    allAnimeCards[existingIndex] = { ...allAnimeCards[existingIndex], ...card };
                } else {
                    allAnimeCards.push(card);
                }
            });
            filterCategory(activeCategory);
        }

        // ==================== CATEGORY FILTER LOGIC ====================
        function filterCategory(cat) {
            activeCategory = cat;

            // Reset All Button Styles
            document.querySelectorAll('.cat-btn').forEach(btn => {
                btn.className = "cat-btn bg-gray-800 hover:bg-gray-700 text-gray-300 font-semibold text-xs px-4 py-1.5 rounded-full border border-gray-700 transition flex items-center gap-1.5 whitespace-nowrap";
            });

            // Highlight Active Button
            const activeBtn = document.getElementById(`btn-${cat}`);
            if (activeBtn) {
                if (cat === 'hentai') {
                    activeBtn.className = "cat-btn bg-red-600 text-white font-bold text-xs px-4 py-1.5 rounded-full border border-red-500 transition flex items-center gap-1.5 whitespace-nowrap shadow-lg shadow-red-900/40";
                } else {
                    activeBtn.className = "cat-btn bg-[#66fcf1] text-black font-bold text-xs px-4 py-1.5 rounded-full transition flex items-center gap-1.5 whitespace-nowrap shadow-md";
                }
            }

            // Update Section Title
            const titles = {
                'all': 'Explore Anime',
                'series': 'Anime Series & Seasons',
                'movie': 'Anime Movies',
                'hentai': '18+ Hentai Content'
            };
            document.getElementById("gridTitle").innerText = titles[cat] || 'Explore Anime';

            // Filter Array
            let filtered = allAnimeCards;
            if (cat !== 'all') {
                filtered = allAnimeCards.filter(c => (c.type || 'series').toLowerCase() === cat);
            }

            renderCardsGrid(filtered);
        }

        // ==================== LIVE SEARCH DROPDOWN LOGIC ====================
        function handleSearch() {
            const query = document.getElementById("searchInput").value.toLowerCase().trim();
            const dropdown = document.getElementById("searchDropdown");

            if (!query) {
                dropdown.classList.add("hidden");
                return;
            }

            const matches = allAnimeCards.filter(card => 
                card.title.toLowerCase().includes(query) || 
                (card.genres && card.genres.toLowerCase().includes(query)) ||
                (card.type && card.type.toLowerCase().includes(query))
            );

            if (matches.length === 0) {
                dropdown.innerHTML = `<div class="p-4 text-center text-xs text-gray-400">No matching anime found</div>`;
            } else {
                dropdown.innerHTML = matches.map(card => `
                    <a href="7anime_videoplayer.html?anime=${card.slug}" class="flex items-center gap-3 p-2.5 hover:bg-[#0b0c10] border-b border-gray-800/60 transition group">
                        <img src="${formatImageUrl(card.image)}" class="w-10 h-12 object-cover rounded shadow" onerror="this.src='https://via.placeholder.com/100x120/1f2833/ffffff?text=7A'">
                        <div class="flex flex-col flex-1 min-w-0">
                            <div class="flex items-center gap-2 mb-0.5">
                                ${getTypeBadge(card.type)}
                                <span class="text-[11px] text-gray-400 line-clamp-1">${card.genres || 'Anime'}</span>
                            </div>
                            <span class="text-sm font-semibold text-white group-hover:text-[#66fcf1] truncate">${card.title}</span>
                        </div>
                        <i class="fa-solid fa-chevron-right text-gray-500 text-xs pr-2"></i>
                    </a>
                `).join("");
            }

            dropdown.classList.remove("hidden");
        }

        // Close search dropdown when clicking outside
        document.addEventListener("click", (e) => {
            const searchInput = document.getElementById("searchInput");
            const dropdown = document.getElementById("searchDropdown");
            if (!searchInput.contains(e.target) && !dropdown.contains(e.target)) {
                dropdown.classList.add("hidden");
            }
        });

        function renderHeroBanner(banner) {
            const bgImg = formatImageUrl(banner.image);
            document.getElementById("heroSection").style.backgroundImage = `url('${bgImg}')`;
            document.getElementById("bannerTitle").innerText = banner.title || "Solo Leveling";
            document.getElementById("bannerDesc").innerText = banner.description || "";
            document.getElementById("bannerPlayBtn").href = `7anime_videoplayer.html?anime=${banner.play_slug || 'solo_leveling'}`;
            document.getElementById("bannerDownloadBtn").href = `download.html?anime=${banner.play_slug || 'solo_leveling'}`;
        }

        function renderCardsGrid(cards) {
            const grid = document.getElementById("animeGrid");
            document.getElementById("totalCardsCount").innerText = `${cards.length} Titles Available`;

            if (cards.length === 0) {
                grid.innerHTML = `<div class="col-span-full text-center py-12 text-gray-500">No content found in this category.</div>`;
                return;
            }

            grid.innerHTML = cards.map(card => `
                <div class="bg-[#1f2833] rounded-xl overflow-hidden shadow-lg border border-gray-800 card-hover flex flex-col justify-between">
                    <a href="7anime_videoplayer.html?anime=${card.slug}">
                        <div class="relative aspect-[3/4] w-full overflow-hidden bg-gray-900">
                            <img src="${formatImageUrl(card.image)}" alt="${card.title}" class="w-full h-full object-cover" onerror="this.src='https://via.placeholder.com/300x420/1f2833/ffffff?text=7anime'">
                            
                            <!-- Type Badge -->
                            <div class="absolute top-2 left-2">
                                ${getTypeBadge(card.type)}
                            </div>

                            <!-- Rating Badge -->
                            <span class="absolute top-2 right-2 bg-black/80 text-[#66fcf1] font-bold text-xs px-2 py-0.5 rounded flex items-center gap-1">
                                <i class="fa-solid fa-star text-yellow-400"></i> ${card.rating || '8.0'}
                            </span>
                        </div>
                    </a>
                    <div class="p-3 flex flex-col justify-between flex-1">
                        <div>
                            <a href="7anime_videoplayer.html?anime=${card.slug}" class="font-bold text-white text-sm hover:text-[#66fcf1] line-clamp-1">
                                ${card.title}
                            </a>
                            <p class="text-xs text-gray-400 mt-1 line-clamp-1">${card.genres || 'Action, Series'}</p>
                        </div>
                        <div class="flex items-center justify-between gap-2 mt-3 pt-2 border-t border-gray-700/50">
                            <a href="7anime_videoplayer.html?anime=${card.slug}" class="flex-1 bg-[#66fcf1] hover:bg-[#45a29e] text-black text-xs font-bold py-1.5 rounded text-center transition">
                                Watch
                            </a>
                            <a href="download.html?anime=${card.slug}" class="bg-gray-800 hover:bg-gray-700 text-white text-xs p-1.5 rounded transition border border-gray-700" title="Download">
                                <i class="fa-solid fa-download"></i>
                            </a>
                        </div>
                    </div>
                </div>
            `).join("");
        }

        window.addEventListener("DOMContentLoaded", initPage);
    </script>
</body>
</html>
