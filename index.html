<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>7anime - Watch & Download Anime Free</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #0b0c10;
            color: #c5c6c7;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .hero-gradient {
            background: linear-gradient(0deg, #0b0c10 0%, rgba(11,12,16,0.7) 50%, rgba(11,12,16,0.3) 100%);
        }
        .card-hover:hover {
            transform: translateY(-6px);
            transition: all 0.3s ease;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- ==================== NAVBAR ==================== -->
    <nav class="sticky top-0 z-50 bg-[#1f2833]/90 backdrop-blur-md border-b border-gray-800 px-4 py-3 shadow-lg">
        <div class="max-w-7xl mx-auto flex flex-col md:flex-row items-center justify-between gap-3">
            <!-- Logo -->
            <div class="flex items-center justify-between w-full md:w-auto">
                <a href="index.html" class="flex items-center gap-2 text-2xl font-extrabold text-[#66fcf1]">
                    <i class="fa-solid fa-play-circle text-3xl"></i>
                    <span>7<span class="text-white">anime</span></span>
                </a>
                <span class="text-xs bg-[#45a29e] text-black px-2 py-0.5 rounded font-bold md:hidden">v2.0</span>
            </div>

            <!-- Search Bar -->
            <div class="relative w-full md:w-96">
                <input 
                    type="text" 
                    id="searchInput" 
                    oninput="handleSearch()"
                    placeholder="Search anime (e.g. Solo Leveling, Naruto)..." 
                    class="w-full bg-[#0b0c10] border border-gray-700 rounded-full py-2 px-4 pl-10 text-sm text-white focus:outline-none focus:border-[#66fcf1]"
                >
                <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-3 text-gray-400 text-sm"></i>
            </div>
        </div>
    </nav>

    <!-- ==================== HERO BANNER ==================== -->
    <section id="heroSection" class="relative w-full h-[400px] md:h-[500px] bg-cover bg-center flex items-end">
        <div class="absolute inset-0 hero-gradient"></div>
        <div class="relative max-w-7xl mx-auto px-4 pb-8 w-full z-10 flex flex-col gap-3">
            <span class="bg-[#66fcf1] text-black font-bold text-xs uppercase px-2.5 py-1 rounded w-fit">Featured Anime</span>
            <h1 id="bannerTitle" class="text-3xl md:text-5xl font-black text-white drop-shadow-md">Loading Hero Banner...</h1>
            <p id="bannerDesc" class="text-sm md:text-base text-gray-300 max-w-2xl line-clamp-3">Please wait while content loads from server...</p>
            
            <div class="flex items-center gap-4 mt-2">
                <a id="bannerPlayBtn" href="#" class="bg-[#66fcf1] hover:bg-[#45a29e] text-black font-bold px-6 py-2.5 rounded-lg flex items-center gap-2 transition">
                    <i class="fa-solid fa-play"></i> Watch Now
                </a>
                <a id="bannerDownloadBtn" href="#" class="bg-gray-800 hover:bg-gray-700 text-white font-semibold px-5 py-2.5 rounded-lg flex items-center gap-2 transition border border-gray-700">
                    <i class="fa-solid fa-download"></i> Download
                </a>
            </div>
        </div>
    </section>

    <!-- ==================== ANIME CARDS GRID ==================== -->
    <main class="max-w-7xl mx-auto px-4 py-8 flex-1 w-full">
        <div class="flex items-center justify-between mb-6">
            <h2 class="text-xl md:text-2xl font-bold text-white border-l-4 border-[#66fcf1] pl-3">Explore Anime</h2>
            <span id="totalCardsCount" class="text-xs text-gray-400">Loading library...</span>
        </div>

        <!-- Grid Container -->
        <div id="animeGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4 md:gap-6">
            <!-- Skeleton Loading Placeholders -->
            <div class="animate-pulse bg-[#1f2833] h-64 rounded-xl"></div>
            <div class="animate-pulse bg-[#1f2833] h-64 rounded-xl"></div>
            <div class="animate-pulse bg-[#1f2833] h-64 rounded-xl"></div>
            <div class="animate-pulse bg-[#1f2833] h-64 rounded-xl"></div>
            <div class="animate-pulse bg-[#1f2833] h-64 rounded-xl"></div>
        </div>
    </main>

    <!-- ==================== FOOTER ==================== -->
    <footer class="bg-[#1f2833] border-t border-gray-800 text-center py-6 text-sm text-gray-400 mt-auto">
        <p>© 2026 7anime Engine. Powered by Telegram Stream Engine.</p>
    </footer>

    <!-- ==================== JS LOGIC ==================== -->
    <script>
        // Render Web Service Base URLs (Update these after Render deployment)
        const BOT1_API = "https://7anime-bot1-scanner.onrender.com";
        const BOT4_API = "https://7anime-bot4-admin.onrender.com";

        let allAnimeCards = [];

        // Fallback Default Banner Data
        const defaultBanner = {
            title: "Solo Leveling",
            image: "https://m.media-amazon.com/images/M/MV5BODlhM2RmM2ItM2FkYi00ZGY2LTg2NzAtNjg4NTgwOGVhMDFkXkEyXkFqcGdeQXVyMTI1NDEyNTM5._V1_.jpg",
            description: "In a world where hunters must battle deadly monsters, Sung Jinwoo is known as the weakest hunter of all mankind.",
            play_slug: "solo_leveling"
        };

        // Initialize Page Data
        async function initPage() {
            await Promise.all([loadBannerAndAdminCards(), loadScannedAnime()]);
        }

        // Fetch Hero Banner & Admin Cards from Bot 4
        async function loadBannerAndAdminCards() {
            try {
                const res = await fetch(`${BOT4_API}/api/site-data`);
                if (!res.ok) throw new Error("Bot 4 Offline");
                const data = await res.json();

                renderHeroBanner(data.banner || defaultBanner);
                if (data.cards && data.cards.length > 0) {
                    mergeCards(data.cards);
                }
            } catch (err) {
                console.warn("Using Default Banner due to Bot 4 offline:", err);
                renderHeroBanner(defaultBanner);
            }
        }

        // Fetch Channel Scanned Animes from Bot 1
        async function loadScannedAnime() {
            try {
                const res = await fetch(`${BOT1_API}/api/all-anime`);
                if (!res.ok) throw new Error("Bot 1 Offline");
                const scannedData = await res.json();

                const formattedCards = Object.keys(scannedData).map(slug => {
                    const item = scannedData[slug];
                    return {
                        title: item.title,
                        image: "https://via.placeholder.com/300x420/1f2833/66fcf1?text=" + encodeURIComponent(item.title),
                        genres: "Action, Anime",
                        rating: "8.5",
                        slug: slug
                    };
                });

                mergeCards(formattedCards);
            } catch (err) {
                console.warn("Could not fetch scanned anime from Bot 1:", err);
            }
        }

        // Merge and Render Cards uniquely
        function mergeCards(newCards) {
            newCards.forEach(card => {
                if (!allAnimeCards.some(c => c.slug === card.slug)) {
                    allAnimeCards.push(card);
                }
            });
            renderCardsGrid(allAnimeCards);
        }

        // Render Hero Banner UI
        function renderHeroBanner(banner) {
            document.getElementById("heroSection").style.backgroundImage = `url('${banner.image}')`;
            document.getElementById("bannerTitle").innerText = banner.title;
            document.getElementById("bannerDesc").innerText = banner.description;
            document.getElementById("bannerPlayBtn").href = `7anime_videoplayer.html?anime=${banner.play_slug}`;
            document.getElementById("bannerDownloadBtn").href = `download.html?anime=${banner.play_slug}`;
        }

        // Render Anime Cards Grid UI
        function renderCardsGrid(cards) {
            const grid = document.getElementById("animeGrid");
            document.getElementById("totalCardsCount").innerText = `${cards.length} Titles Available`;

            if (cards.length === 0) {
                grid.innerHTML = `<div class="col-span-full text-center py-12 text-gray-500">No anime cards found. Add via Bot 4 command <code>/addcard</code></div>`;
                return;
            }

            grid.innerHTML = cards.map(card => `
                <div class="bg-[#1f2833] rounded-xl overflow-hidden shadow-lg border border-gray-800 card-hover flex flex-col justify-between">
                    <a href="7anime_videoplayer.html?anime=${card.slug}">
                        <div class="relative aspect-[3/4] w-full overflow-hidden bg-gray-900">
                            <img src="${card.image}" alt="${card.title}" class="w-full h-full object-cover" onerror="this.src='https://via.placeholder.com/300x420/1f2833/ffffff?text=7anime'">
                            <span class="absolute top-2 right-2 bg-black/80 text-[#66fcf1] font-bold text-xs px-2 py-0.5 rounded flex items-center gap-1">
                                <i class="fa-solid fa-star text-yellow-400"></i> ${card.rating || '8.0'}
                            </span>
                        </div>
                    </a>
                    <div class="p-3 flex flex-col justify-between flex-1">
                        <div>
                            <a href="7anime_videoplayer.html?anime=${card.slug}" class="font-bold text-white text-sm hover:text-[#66fcf1] line-clamp-1">
                                ${card.title}
                            </a>
                            <p class="text-xs text-gray-400 mt-1 line-clamp-1">${card.genres || 'Action, Series'}</p>
                        </div>
                        <div class="flex items-center justify-between gap-2 mt-3 pt-2 border-t border-gray-700/50">
                            <a href="7anime_videoplayer.html?anime=${card.slug}" class="flex-1 bg-[#66fcf1] hover:bg-[#45a29e] text-black text-xs font-bold py-1.5 rounded text-center transition">
                                Watch
                            </a>
                            <a href="download.html?anime=${card.slug}" class="bg-gray-800 hover:bg-gray-700 text-white text-xs p-1.5 rounded transition border border-gray-700" title="Download">
                                <i class="fa-solid fa-download"></i>
                            </a>
                        </div>
                    </div>
                </div>
            `).join("");
        }

        // Real-time Search Handler
        function handleSearch() {
            const query = document.getElementById("searchInput").value.toLowerCase().trim();
            if (!query) {
                renderCardsGrid(allAnimeCards);
                return;
            }
            const filtered = allAnimeCards.filter(card => 
                card.title.toLowerCase().includes(query) || 
                (card.genres && card.genres.toLowerCase().includes(query))
            );
            renderCardsGrid(filtered);
        }

        // Start execution on page load
        window.addEventListener("DOMContentLoaded", initPage);
    </script>
</body>
</html>
